[3,["<div class='text'>Daniel had always loved taking photos with his phone. One summer, he decided to enter a photography contest in his town. At first, he was nervous because most other participants had professional cameras, while he only had his phone. Still, Daniel spent several days walking around the city, trying to capture something special. One evening, after the rain, he noticed how the streetlights reflected in the puddles. The picture looked simple but beautiful, and he sent it to the contest. A week later, Daniel was shocked to learn that he had won first place! The judges said his photo showed real emotion and creativity. From that moment, Daniel understood that passion and a good eye are more important than expensive equipment.</div>What lesson does Daniel learn from his experience?",["He learnt that it is necessary to own a professional camera","He studied photography from others","He realized that creativity matters more than equipment","He became uninterested in taking pictures","He thought the contest was unfair"],"Последнее предложение: passion and a good eye are more important than expensive equipment.",["Противоречит тексту: он победил с телефоном.","В тексте не сказано, что он учился у других.","Наоборот, он продолжал фотографировать.","Он победил — о несправедливости ничего нет."],1,2]],
[3,["<div class='text'>Lara had always dreamed of visiting the mountains. Last summer, she and her family went to a small village near the hills. On the first day, Lara was disappointed because there was no Internet and no shops nearby. She thought the trip would be boring. However, the next morning, she went for a walk with her father. They climbed a hill and saw a wide green valley covered with wildflowers. Lara listened to the sound of the wind and birds and felt calm in a way she had never felt before. She spent the rest of the week hiking, taking photos, and talking with local people who told her stories about life in the mountains. When the family returned home, Lara realized that sometimes the best moments happen when you disconnect from technology and just enjoy nature.</div>What did Lara discover during her trip?",["She wanted to move to countryside","She discovered the joy of nature without technology.","She made new friends","She went there alone to clear her mind","She didn't like the peace and quiet"],"Последнее предложение: disconnect from technology and just enjoy nature.",["О переезде ничего не сказано.","Она говорила с местными, но это деталь, а не главный вывод.","Она ездила с семьёй.","Наоборот: felt calm — ей понравилось."],1,1]],
[3,["<div class='text'>Tom used to think that cooking was boring and difficult. He often ate fast food after school because it was quick and tasty. One day, his older sister invited him to help her make dinner. At first, Tom didn't know what to do, but he started cutting vegetables and mixing ingredients for the soup. The kitchen smelled amazing, and when the food was ready, everyone sat down together to eat. Tom was surprised by how delicious the soup was and how proud he felt after helping to make it. From that day on, he began cooking small meals on weekends instead of buying junk food.</div>What did Tom realize after his cooking experience?",["He realized that cooking can be fun and satisfying.","He failed to make a soup","He started liking fast food even more","He did not help his sister","He ate the food alone"],"Суп вкусный + гордость + стал готовить сам → готовить приятно.",["Суп получился вкусным.","Наоборот: стал готовить вместо фастфуда.","Он помогал (cutting, mixing).","Ели все вместе (everyone sat down together)."],1,0]],
[3,["<div class='text'>Maya loves movies and usually spends her weekends watching films at home. Last Saturday, her friend invited her to a small outdoor music festival. At first, Maya wasn't very excited — she thought it would be too noisy and crowded. But when she arrived, she was surprised by the friendly atmosphere. People were singing, dancing, and enjoying live bands together. Maya tried some new street food, joined a dance circle, and even talked with the musicians after their performance. When she got home that night, she felt happier than she had in weeks. She realized that sometimes real entertainment isn't just about watching — it's about taking part and sharing the moment with others.</div>What did Maya learn from her weekend experience?",["She refused to go and stayed at home","She learned that fun comes from joining in with others.","She found the atmosphere to be boring","She went on stage and performed","She watched a new movie and walked around the city"],"Последнее предложение: taking part and sharing the moment with others.",["Она пошла на фестиваль.","Атмосфера была friendly.","Она говорила с музыкантами, но не выступала.","Фильм она не смотрела."],1,1]],
[3,["<div class='text'>Ryan used to spend most of his time playing video games after school. He liked watching football matches on TV but never thought about playing himself. One day, his friend invited him to join the local football team. At first, Ryan was nervous — he wasn't very fit and didn't know many of the rules. During the first few practices, he got tired quickly and even wanted to quit. But his teammates encouraged him to keep going. After a few weeks, Ryan noticed that he could run faster, pass better, and felt more confident. When his team won their first game, he realized how great it felt to be part of something bigger than himself.</div>What did Ryan understand after joining the football team?",["He continued to play videogames","He started skipping PE classes","He encouraged his friend to join a football team","He decided to start running every day","He realized that teamwork and practice lead to success"],"Тренировки (practices) + поддержка команды → победа и уверенность.",["Текст о переходе от игр к футболу.","О физкультуре ничего не сказано.","Наоборот: друг пригласил ЕГО.","Про ежедневный бег в тексте нет."],1,4]]

{title:"Эссе A: Young people never want to dress the same as their parents", text:`Fashion is one of the most visible ways in which teenagers show who they are. Some people believe that young people never want to dress like their parents. In my opinion, this statement is only partly true, because the word "never" is too strong.

On the one hand, it is natural for teenagers to want to look different. They follow trends from social media and their favourite singers, and they often see their parents' clothes as old-fashioned. Wearing something unique helps them feel independent and confident.

On the other hand, many styles return every twenty or thirty years. For example, the jeans and trainers my mother wore in the 1990s are fashionable again, and I have even borrowed her denim jacket. Moreover, comfortable and practical clothes are popular with every generation.

To sum up, although young people usually prefer their own style, they do not always reject their parents' clothes. Fashion connects generations more than we think.`},
{title:"Эссе B: Famous people deserve a private life", text:`Every day we see photos of footballers, actors and politicians in newspapers and online. Many people believe that famous people deserve a private life without journalists following them everywhere. I completely agree with this opinion.

Firstly, celebrities are human beings, just like us. They have families and problems, and they need time to relax without cameras. Imagine how stressful it must be when you cannot even go to a café without being photographed.

Secondly, photographers sometimes put people in real danger. There have been cases when paparazzi chased a famous person's car, which led to terrible accidents. The children of celebrities also suffer, although they did nothing to become famous.

However, politicians are a special case. Since they make decisions about our lives, journalists should report on their work and on how they spend public money.

In conclusion, the public has a right to know about famous people's professional lives, but their private lives should stay private.`},
{title:"Эссе C: Computer games teach us nothing", text:`A local newspaper recently claimed that computer games teach us nothing and that young people should avoid them. From my own experience, I strongly disagree with this view.

To begin with, many games develop useful skills. When I play strategy games, I have to plan ahead, solve problems quickly and manage resources. In team games, I learn to cooperate with other players, often in English, which has improved my vocabulary.

Furthermore, some games are educational. There are games about history, geography and even programming, and they make learning fun instead of boring.

Of course, games can be harmful if people play for too long. Some teenagers become addicted, sleep badly and stop doing sport. That is why it is important to set limits, for example one hour a day after homework.

In conclusion, computer games are not useless. If we play them sensibly, they can teach us a lot and also help us relax.`},
{title:"Эссе D: What would your ideal job be and why?", text:`Choosing a future job is one of the most important decisions in life. If I could choose any job, I would like to become a children's doctor.

The main reason is that I want to help people. When I was eight, I spent a week in hospital, and a kind doctor explained everything to me and made me feel safe. I will never forget her, and I would like to do the same for children.

Another reason is that medicine is always developing. Doctors have to keep learning, so the job is never boring. I am good at biology and chemistry, which are essential subjects for this profession.

Of course, I know that it is a difficult job. Doctors study for many years and often work at night. However, I believe that the satisfaction of saving lives is worth the hard work.

To conclude, being a paediatrician would be my ideal job because it combines helping others with lifelong learning.`},
{title:"Рассказ: A challenge you overcame — «The Longest Hundred Metres»", text:`I have never been a good swimmer. Last spring, our PE teacher announced that every student had to swim one hundred metres before the end of the year, and my heart sank. Deep water terrified me.

For the first two weeks, I could barely reach the end of the pool. Some classmates laughed, and I wanted to give up. Then my older cousin, who is a lifeguard, offered to help. Every Saturday at seven in the morning, we met at the pool. He taught me how to breathe properly and, most importantly, how to stay calm.

On the day of the test, my legs were shaking. "Just think about the next stroke," my cousin had told me. I pushed off from the wall and swam, length after length. When I touched the wall for the last time, everyone was cheering.

That day I learnt that fear can be beaten with patience and practice.`},
{title:"Рассказ: The time you felt the most scared — «The Night the Lights Went Out»", text:`It was a stormy evening in November, and I was home alone for the first time. My parents had gone to a friend's party and promised to be back by ten.

At about eight o'clock, while I was doing my homework, there was a loud crash of thunder and suddenly all the lights went out. The house was completely dark. Then I heard a strange scratching noise coming from the kitchen. My heart was pounding so hard that I could hear it.

Holding my phone as a torch, I crept towards the kitchen. "Who's there?" I whispered. The scratching stopped. I pushed the door open and pointed the light at the window.

There, sitting on the windowsill, was our neighbour's cat, soaking wet and desperate to come in! I burst out laughing with relief and let her in. We spent the rest of the evening together, waiting for the lights to come back.`}
],

/* ---------- нормализация вопросов ---------- */
const CANON=[["Yes","No"],["True","False","Not Given"],["True","False","Doesn't say"],["True","False"],["P","D","B"]];
function norm(raw,id){
  if(raw&&raw.t==="order")return{id,type:"order",q:raw.q,items:raw.items,expl:raw.e};
  if(typeof raw[1]==="string"&&raw[1][0]==="="){
    return{id,type:"input",q:raw[0],ans:raw[1].slice(1).split("|"),expl:raw[2]};
  }
  const opts=raw[1].slice();const hasIdx=raw.length>=6&&typeof raw[5]==="number";
  const ci=hasIdx?raw[5]:0;const correct=opts[ci];const notes={};const nl=raw[3]||[];
  let k=0;opts.forEach((o,i)=>{if(i!==ci){if(nl[k])notes[o]=nl[k];k++;}});
  let display=opts,fixed=!!raw[4];
  const set=opts.slice().sort().join("|");
  for(const c of CANON){if(c.slice().sort().join("|")===set){display=c.slice();fixed=true;break;}}
  if(/^[A-F]$/.test(opts[0])&&opts.every(o=>/^[A-Fa-f]$/.test(o)))fixed=true;
  if(!fixed)display=shuffle(opts);
  return{id,type:"mc",q:raw[0],opts:display,correct,expl:raw[2],notes,letters:opts.every(o=>o.length<=2)};
}

/* ---------- сборка модулей ---------- */
const ALLQ={};const MODS={};
function regModule(m,stage,kind){
  m.stage=stage;m.kind=kind;
  let sets=[];
  if(m.sets){sets=m.sets.map(s=>({title:s.title,text:s.text||"",raw:s.q==="DIST"?D.distTest.map(x=>x[1]):s.q}));}
  else sets=[{title:m.title,text:m.text||"",raw:m.q}];
  m.sets=sets.map((s,si)=>({title:s.title,text:s.text,qids:s.raw.map((r,qi)=>{const id=m.id+":"+si+":"+qi;ALLQ[id]={raw:r,text:s.text,mod:m.id};return id;})}));
  m.total=m.sets.reduce((a,s)=>a+s.qids.length,0);
  MODS[m.id]=m;return m;
}
function vocabQs(set){
  const W=set.words;const out=[];
  W.forEach((w,i)=>{
    const others=W.filter(x=>x!==w);
    const d1=pick(others,3);
    out.push({type:"mc",q:`What does <b>«${esc(w[0])}»</b> mean?`,opts:shuffle([w[1],...d1.map(x=>x[1])]),correct:w[1],expl:`«${w[0]}» — ${w[1]}. ${w[2]?"("+w[2]+")":""}`,notes:Object.fromEntries(d1.map(x=>[x[1],`«${x[1]}» — это «${x[0]}».`])),speak:w[0]});
    const d2=pick(others,3);
    if(w[2])out.push({type:"mc",q:`Which word means: <i>${esc(w[2])}</i>?`,opts:shuffle([w[0],...d2.map(x=>x[0])]),correct:w[0],expl:`«${w[0]}» = ${w[2]} (${w[1]}).`,notes:Object.fromEntries(d2.map(x=>[x[0],`«${x[0]}» = ${x[2]||x[1]} (${x[1]}).`])),speak:w[0]});
    if(!/↔/.test(w[0]))out.push({type:"input",q:`Напиши по-английски: <b>${esc(w[1])}</b>`,ans:[w[0]],expl:`${w[1]} — «${w[0]}».`,speak:w[0]});
  });
  return out;
}
const STAGE={1:{title:"Этап 1 · Районный",sub:"База + все ловушки районного теста",groups:[]},2:{title:"Этап 2 · Республиканский",sub:"Повышенная сложность: формат областного и республиканского этапа",groups:[]}};

    {t:"🧠 Грамматика",mods:D.grammar1.map(m=>regModule(m,1,"q"))},

    {t:"🗂️ Прошлый год",mods:D.past.filter(p=>p.stage===1).map(m=>regModule(m,1,"q"))}
  ];
  STAGE[2].groups=[
    {t:"🧠 Грамматика B1+/B2",mods:D.grammar2.map(m=>regModule(m,2,"q"))},
    {t:"📚 Лексика B2",mods:D.vocab2.map(m=>regVocab(m,2))},

}

function confetti(){const c=document.createElement("canvas");c.id="fx";document.body.appendChild(c);const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#c6ff3d","#8b7bff","#ff5fa2","#ffc83d","#4cc9ff"];const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});if(++f<110)requestAnimationFrame(loop);else c.remove();})();}

  </div>`);

// cfg: {title, mod, ids?, qs?, keepOrder, exam:{points[], minutes}, onDone, back}
function runQuiz(cfg){
  stopAll();
  let list=(cfg.qs||cfg.ids.map(id=>Object.assign(norm(ALLQ[id].raw,id),{text:ALLQ[id].text})));
  let i=0,combo=0,right=0,earned=0,log=[];const exam=cfg.exam;let tEnd=exam?Date.now()+exam.minutes*60e3:0;
  const pts=k=>exam?(exam.points[k]||1):1;
  function render(){
    const q=list[i];const pr=Math.round(i/list.length*100);
    const withText=q.text&&q.text.length>0;
    V(`<div class="qtop"><button class="back" id="quit" style="margin:0">✕</button><div class="prog"><i style="width:${pr}%"></i></div>
      <span class="small mute">${i+1}/${list.length}</span>
      ${exam?`<span class="timer" id="tm">--:--</span>`:`<span class="combo ${combo>=5?"hot":""}">🔥 ×${combo}</span>`}</div>
      <div class="qlayout ${withText?"withText":""}">
        ${withText?`<details class="ptoggle" open><summary>📄 Текст задания (свернуть/развернуть)</summary><div class="passage">${q.text}</div></details>`:""}
        <div class="qcard"><div class="qtext">${q.q}</div><div id="ans"></div><div id="fb"></div></div>
      </div>`);
    $("#quit").onclick=()=>{stopAll();(cfg.back||(()=>go(cur)))();};
    if(exam){const upd=()=>{const s=Math.max(0,Math.round((tEnd-Date.now())/1000));const e=$("#tm");if(e){e.textContent=`${s/60|0}:${String(s%60).padStart(2,"0")}`;e.classList.toggle("warn",s<120);}if(s<=0){finish(true);}};upd();timers.push(setInterval(upd,1000));}
    if(q.type==="mc")mc(q);else if(q.type==="input")inp(q);else order(q);
  }
  function after(ok,given){
    const q=list[i];
    log.push({q,ok,given});
    const st=(q.id&&ALLQ[q.id]&&MODS[ALLQ[q.id].mod]?MODS[ALLQ[q.id].mod].stage:(cfg.mod&&MODS[cfg.mod]?MODS[cfg.mod].stage:1))||1;
    addRp(ok?(st===2?14:10)+(exam?4:0):-4);
    if(ok){right++;combo++;earned+=pts(i);S.correct++;if(combo>S.maxCombo)S.maxCombo=combo;delete S.mist[q.id];
      if(!exam){addXp(10+Math.min(10,combo*2));combo%5===0?(sfx.combo(),toast(`🔥 Комбо ×${combo}!`)):sfx.ok();}}
    else{combo=0;if(q.id){S.mist[q.id]={n:((S.mist[q.id]||{}).n||0)+1,t:Date.now()};}if(!exam)sfx.bad();}
    save();checkBadges();
    if(exam){next();return;}
    const fb=$("#fb");const note=!ok&&q.type==="mc"?`<div class="why">✗ <b>«${esc(given)}»</b> — ${prettyNote(given,q)}</div>`:"";
    const corrTxt=q.type==="order"?"":(q.type==="input"?q.ans[0]:q.correct);
    fb.innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="h">${ok?pickOne(["✅ Верно!","✅ Точно!","✅ Отлично!","✅ Есть!","✅ В яблочко!"]):"❌ Не совсем"}</div>
      ${!ok&&q.type!=="order"?`<div>Правильно: <b style="color:var(--ok)">${esc(corrTxt)}</b>${!ok&&q.type==="input"?` · ты написал: <b style="color:var(--bad)">${esc(given||"—")}</b>`:""}</div>`:""}
      ${note}<div class="why">💡 ${q.expl}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="nx">Дальше ↵</button>${q.speak&&canSpeak?`<button class="btn sec2 small" id="spk">🔊 ${esc(q.speak)}</button>`:""}</div></div>`;
    if(q.speak&&canSpeak)$("#spk").onclick=()=>speak(q.speak);
    $("#nx").onclick=next;$("#nx").focus();
    document.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();next();}};
  }
  function next(){document.onkeydown=null;i++;if(i>=list.length)finish(false);else{render();window.scrollTo(0,0);}}
  function mc(q){
    const L=q.opts.length<=6;
    $("#ans").innerHTML=`<div class="opts ${q.letters&&q.opts.length<=6?"letters":""}">${q.opts.map((o,k)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${k+1}</span><span>${o}</span></button>`).join("")}</div>`;
    let done=false;
    const choose=(b)=>{if(done)return;done=true;const g=b.dataset.o;const ok=g===q.correct;
      if(!exam){document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===q.correct)x.classList.add("ok");else if(x!==b)x.classList.add("dim");});if(!ok)b.classList.add("bad");}
      after(ok,g);};
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b));
    document.onkeydown=e=>{const n=parseInt(e.key);if(n>=1&&n<=q.opts.length){choose(document.querySelectorAll(".opt")[n-1]);}};
  }
  function inp(q){
    $("#ans").innerHTML=`<input class="inp" id="iv" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Впиши ответ…"><div class="row" style="margin-top:12px"><button class="btn" id="chk">Проверить ↵</button><span class="mute small">Регистр букв не важен</span></div>`;
    const iv=$("#iv");iv.focus();let done=false;
    const go2=()=>{if(done)return;const v=iv.value;if(!v.trim())return;done=true;const ok=q.ans.some(a=>clean(a)===clean(v));iv.classList.add(ok?"ok":"bad");iv.disabled=true;after(ok,v);};
    $("#chk").onclick=go2;iv.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();go2();}};
  }
  function order(q){
    const pool=shuffle(q.items.map((t,k)=>({t,k})));const ansA=[];
    const draw=()=>{$("#ans").innerHTML=`<div class="mute small" style="margin-bottom:6px">Нажимай на пункты по порядку. Нажми на пункт в ответе, чтобы убрать его.</div><div class="order-ans">${ansA.map((x,n)=>`<button class="order-item" data-a="${n}"><span class="n">${n+1}.</span> ${x.t}</button>`).join("")||'<span class="mute small">…</span>'}</div><div class="order-pool">${pool.filter(x=>!ansA.includes(x)).map(x=>`<button class="order-item" data-p="${x.k}">${x.t}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" id="chk" ${ansA.length<q.items.length?"disabled style='opacity:.5'":""}>Проверить</button></div>`;
      document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ansA.push(pool.find(x=>x.k==b.dataset.p));draw();});
      document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ansA.splice(+b.dataset.a,1);draw();});
      const c=$("#chk");if(ansA.length===q.items.length)c.onclick=()=>{const ok=ansA.every((x,n)=>x.k===n);
        $("#ans").innerHTML=`<div class="order-ans">${q.items.map((t,n)=>`<div class="order-item" style="border-color:${ansA[n].k===n?"var(--ok)":"var(--bad)"}"><span class="n">${n+1}.</span> ${t}</div>`).join("")}</div><div class="mute small">Показан правильный порядок. Зелёным — пункты, которые ты поставил верно.</div>`;
        after(ok,ansA.map(x=>x.k+1).join("-"));};};
    draw();
  }
  function finish(timeout){
    stopAll();const n=list.length,pct=Math.round(right/n*100);
    const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
    if(cfg.mod&&!exam&&MODS[cfg.mod]&&n>=Math.min(8,MODS[cfg.mod].total)){S.best[cfg.mod]=Math.max(S.best[cfg.mod]||0,stars);}
    if(right===n&&n>=5)S.perfect++;
    if(exam){const tot=list.reduce((a,_,k)=>a+pts(k),0);addXp(right*8);if(cfg.examKey){S.best[cfg.examKey]=Math.max(S.best[cfg.examKey]||0,earned);} }
    save();checkBadges();topbar();
    if(pct>=70){confetti();sfx.win();}
    const wrong=log.filter(x=>!x.ok);
    const tot=exam?list.reduce((a,_,k)=>a+pts(k),0):n;
    V(`<div class="card res"><div style="font-size:48px">${pct>=90?"🏆":pct>=70?"🎉":pct>=40?"💪":"🌱"}</div>
     <div class="score">${exam?earned+" / "+tot:right+" / "+n}</div>
     <div>${starStr(stars)}</div>
     <p class="mute">${timeout?"⏰ Время вышло. ":""}${pct>=90?"Олимпиадный уровень!":pct>=70?"Хорошо! Разбери ошибки ниже — и будет 100.":pct>=40?"Неплохо для начала. Перечитай правило и повтори раунд.":"Начни с карточки правила — потом снова раунд. Получится!"}</p>
     <div class="row" style="justify-content:center">
      ${wrong.length&&wrong.some(w=>w.q.id)?`<button class="btn pink" id="redo">🔁 Перерешать ошибки (${wrong.length})</button>`:""}
      <button class="btn" id="again">▶ Ещё раунд</button>
      <button class="btn sec2" id="bk2">Назад</button></div></div>
     ${wrong.length?`<div class="sec"><h2>Разбор ошибок</h2></div>`+wrong.map(w=>mistCard(w.q,w.given)).join(""):""}
     ${exam&&log.some(x=>x.ok)?`<details class="card" style="margin-top:14px"><summary><b>Показать разбор всех вопросов</b></summary>${log.filter(x=>x.ok).map(w=>mistCard(w.q,null)).join("")}</details>`:""}`);
    $("#bk2").onclick=cfg.back||(()=>go(cur));
    $("#again").onclick=()=>cfg.again?cfg.again():runQuiz(Object.assign({},cfg,cfg.ids&&!cfg.keepOrder&&!exam&&cfg.mod?{ids:pick(MODS[cfg.mod].sets.flatMap(s=>s.qids),Math.min(10,MODS[cfg.mod].total))}:{}));
    const rd=$("#redo");if(rd)rd.onclick=()=>runQuiz({title:"Ошибки",qs:wrong.filter(w=>w.q.id).map(w=>Object.assign(norm(ALLQ[w.q.id].raw,w.q.id),{text:ALLQ[w.q.id].text})),back:cfg.back});
  }
  render();
}
function prettyNote(g,q){const n=(q.notes||{})[g]||"";const L=/^[A-Fa-f]$/.test(g);
  if(L&&(!n||/нет\.?$|этого нет|^Нет/.test(n)))return `в части ${g} нет информации, которая отвечает на этот вопрос. Нужная фраза — в объяснении ниже.`;
  if(!n)return "этот вариант не подходит — разбор правила ниже.";
  let m=n.match(/^(.+?) — нет\.?$/);if(m)return `«${m[1]}» в этой конструкции не употребляется. Правильный вариант и правило — ниже.`;
  if(/^(Наоборот|Противоречит)/.test(n))return n.replace(/\.$/,"")+": текст говорит противоположное.";
  if(/^(Не сказано|Не упомянуто|Нет в тексте|Не указано|В тексте этого нет)/.test(n))return "в тексте этого нет — выбирать можно только то, что прямо сказано или перефразировано.";
  if(n==="Подтверждено.")return "текст это подтверждает, поэтому этот вариант неверен.";
  return n;}
function pickOne(a){return a[Math.random()*a.length|0];}
function unesc(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value;}
function clean(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
function strip(h){const d=document.createElement("div");d.innerHTML=h;d.querySelectorAll(".text,.sign").forEach(x=>{x.textContent="["+x.textContent.slice(0,60)+"…] ";});return d.textContent;}
function mistCard(q,given){
  const corr=q.type==="order"?q.items.map((t,n)=>(n+1)+". "+t).join("<br>"):(q.type==="input"?q.ans[0]:q.correct);
  const note=given&&q.type==="mc"?` — ${prettyNote(given,q)}`:"";
  return `<div class="mist"><div class="q">${esc(strip(q.q)).slice(0,400)}</div>
  ${given!=null?`<div class="y">✗ Твой ответ: ${esc(given||"—")}${note}</div>`:""}<div class="a">✓ ${q.type==="order"?corr:esc(corr)}</div><div class="mute small" style="margin-top:4px">💡 ${q.expl}</div></div>`;
}

function flash(m){

}
function memory(words,back,target){
  const box=target||$("#vbox");const ws=pick(words,6);let cards=shuffle(ws.flatMap((w,i)=>[{i,t:w[0]},{i,t:w[1]}]));let sel=null,done=0,miss=0;const t0=Date.now();

    box.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(sel===null){sel=n;draw();return;}if(sel===n){sel=null;draw();return;}
      if(cards[sel].i===cards[n].i){cards[sel].d=cards[n].d=1;done++;sel=null;sfx.ok();draw();if(done===6){const s=Math.round((Date.now()-t0)/1000);addXp(30);confetti();sfx.win();box.innerHTML=`<div class="card res"><div style="font-size:44px">🧩</div><h2>Все пары за ${s} c!</h2><p class="mute">Промахов: ${miss}. ${ws.map(w=>`<br><b>${esc(w[0])}</b> — ${esc(w[1])}`).join("")}</p><button class="btn" id="ma">Ещё раз</button></div>`;box.querySelector("#ma").onclick=()=>memory(words,back,target);}}
      else{miss++;sfx.bad();const a=sel;sel=null;draw();box.querySelectorAll(".mcard")[a].classList.add("bad");box.querySelectorAll(".mcard")[n].classList.add("bad");}});};
  draw();const iv=setInterval(()=>{const e=document.getElementById("mt");if(!e){clearInterval(iv);return;}e.textContent=Math.round((Date.now()-t0)/1000)+" c";},1000);timers.push(iv);
  box.scrollIntoView({behavior:"smooth"});
}

   <button class="mod" id="gMv"><div class="ic">🃏</div><div style="flex:1"><div class="t">Мемори: случайная лексика</div><div class="s">Слова из всех тем</div></div></button>
   <button class="mod" id="gR"><div class="ic">🔍</div><div style="flex:1"><div class="t">Настоящее слово?</div><div class="s">Yes/No на скорость — как в республиканском этапе</div></div></button>
   <button class="mod" id="gI"><div class="ic">🧱</div><div style="flex:1"><div class="t">Неправильные глаголы: блиц</div><div class="s">Впиши V2 / V3 — 15 глаголов</div></div></button>
  </div><div id="gbox" style="margin-top:16px"></div>`);
  $("#gB1").onclick=()=>blitz(1);$("#gB2").onclick=()=>blitz(2);
  const PV=[["give up","бросить, сдаться"],["give away","отдать даром"],["put off","отложить"],["put out","потушить"],["put up with","терпеть"],["take after","быть похожим"],["take up","начать хобби"],["look after","заботиться"],["look up","найти в словаре"],["run out of","закончиться"],["run into","случайно встретить"],["break down","сломаться"],["call off","отменить"],["set off","отправиться"],["fill in","заполнить"],["cheer up","взбодриться"],["find out","выяснить"],["get over","оправиться"],["turn down","отклонить"],["pass out","потерять сознание"],["fall apart","развалиться"],["give out","раздать"],["bring up","воспитывать"],["carry on","продолжать"]];
  $("#gM").onclick=()=>memory(PV,games,$("#gbox"));
  $("#gMv").onclick=()=>memory(D.vocab1.concat(D.vocab2).flatMap(s=>s.words).filter(w=>!/↔/.test(w[0])),games,$("#gbox"));
  $("#gR").onclick=()=>{const ids=Object.keys(ALLQ).filter(id=>/^Is <b>/.test(String(ALLQ[id].raw[0]))||/^<b>[a-z]+<\/b>$/.test(String(ALLQ[id].raw[0]))||(ALLQ[id].mod==="p-rep"&&id.startsWith("p-rep:4:")));runQuiz({title:"Настоящее слово?",ids:shuffle(ids),back:games});};
  $("#gI").onclick=()=>{const IRR=[["choose","chose","chosen"],["catch","caught","caught"],["forget","forgot","forgotten"],["teach","taught","taught"],["throw","threw","thrown"],["fly","flew","flown"],["seek","sought","sought"],["tear","tore","torn"],["hide","hid","hidden"],["wear","wore","worn"],["break","broke","broken"],["bring","brought","brought"],["buy","bought","bought"],["drive","drove","driven"],["fall","fell","fallen"],["grow","grew","grown"],["lie","lay","lain"],["lay","laid","laid"],["ride","rode","ridden"],["rise","rose","risen"],["shake","shook","shaken"],["steal","stole","stolen"],["swim","swam","swum"],["write","wrote","written"],["begin","began","begun"],["drink","drank","drunk"],["sing","sang","sung"],["eat","ate","eaten"],["speak","spoke","spoken"],["sew","sewed","sewn"]];
    const qs=pick(IRR,15).map(v=>{const f=Math.random()<.5?1:2;return{type:"input",q:`Впиши <b>V${f+1}</b> глагола <b>${v[0]}</b>`,ans:[v[f]],expl:`${v[0]} – ${v[1]} – ${v[2]}`,speak:`${v[0]}, ${v[1]}, ${v[2]}`};});
    runQuiz({title:"Неправильные глаголы",qs,back:games});};
}
function blitz(st){
  stopAll();const pool=shuffle(mcPool(st||1).concat(st?[]:mcPool(2).slice(0,0)));let k=0,score=0,combo=0,tEnd=Date.now()+60e3,wrong=[];
  const draw=()=>{const id=pool[k%pool.length];const q=norm(ALLQ[id].raw,id);
    V(`<div class="qtop"><button class="back" id="quit" style="margin:0">✕</button><span class="disp" style="font-size:22px">⚡ ${score}</span><span class="combo ${combo>=5?"hot":""}">🔥 ×${combo}</span><span class="timer" id="bt" style="margin-left:auto;font-size:20px">60</span></div>
    <div class="qcard"><div class="qtext">${q.q}</div><div class="opts">${q.opts.map((o,n)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${n+1}</span><span>${o}</span></button>`).join("")}</div></div>`);
    $("#quit").onclick=()=>{stopAll();go("games");};
    const ch=b=>{if(b.dataset.used)return;document.querySelectorAll(".opt").forEach(x=>x.dataset.used=1);const g=b.dataset.o;const ok=g===q.correct;addRp(ok?6:-2);if(ok){score++;combo++;tEnd+=2000;S.correct++;sfx.ok();delete S.mist[id];if(combo>S.maxCombo)S.maxCombo=combo;}else{combo=0;tEnd-=3000;sfx.bad();S.mist[id]={n:((S.mist[id]||{}).n||0)+1,t:Date.now()};wrong.push({q,given:g});}
      b.classList.add(ok?"ok":"bad");k++;setTimeout(draw,ok?180:450);};
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>ch(b));
    document.onkeydown=e=>{const n=parseInt(e.key);const bs=document.querySelectorAll(".opt");if(n>=1&&n<=bs.length)ch(bs[n-1]);};
  };
  timers.push(setInterval(()=>{const s=Math.max(0,Math.ceil((tEnd-Date.now())/1000));const e=$("#bt");if(e){e.textContent=s;e.classList.toggle("warn",s<=10);}if(s<=0){stopAll();end();}},200));
  function end(){const rec=score>S.blitz;if(rec)S.blitz=score;addXp(score*5);save();checkBadges();if(score>=10){confetti();sfx.win();}
    V(`<div class="card res"><div style="font-size:48px">⚡</div><div class="score">${score}</div><p>${rec?"🏅 Новый рекорд!":"Рекорд: "+S.blitz}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Ещё раз</button><button class="btn sec2" id="bk">К играм</button></div></div>${wrong.length?`<div class="sec"><h2>Разбор ошибок</h2></div>`+wrong.map(w=>mistCard(w.q,w.given)).join(""):""}`);
    $("#ag").onclick=()=>blitz(st);$("#bk").onclick=()=>go("games");}
  draw();
}

/* ---------- ПИСЬМО ---------- */
function write(){
  const W=D.writing;
  V(`<div class="hero"><span class="pill pink">40 баллов из 100</span><h1 style="margin:10px 0 6px">Письмо</h1><p>Схемы, фразы-клише, образцы на все темы прошлого года, закрытые упражнения и тренажёр с таймером и счётчиком слов.</p></div>
  <div class="sec"><h2>Теория</h2></div>
  <div class="grid g2">${W.theory.map(t=>`<button class="mod" data-t="${t.id}"><div class="ic">${t.icon}</div><div class="t">${esc(t.title)}</div></button>`).join("")}</div>
  <div class="sec"><h2>Упражнения</h2></div>
  <div class="grid g2"><button class="mod" id="wq"><div class="ic">✍️</div><div style="flex:1"><div class="t">Структура, стиль, связки</div><div class="s">${MODS["wr-q"].total} закрытых заданий · ${starStr(S.best["wr-q"]||0)}</div></div></button></div>
  <div class="sec"><h2>Образцы (прошлогодние темы)</h2></div>
  <div class="grid g2">${W.models.map((md,i)=>`<button class="mod" data-md="${i}"><div class="ic">📄</div><div style="flex:1"><div class="t">${esc(md.title)}</div><div class="s">${wc(md.text)} слов</div></div></button>`).join("")}</div>
  <div class="sec"><h2>Тренажёр письма</h2></div>
  <div class="card" id="pad"></div>
  <div id="wbox"></div>`);
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=MODS[b.dataset.t];$("#wbox").innerHTML=`<div class="card theory" style="margin-top:16px"><h2 style="font-size:20px;margin-bottom:8px">${t.icon} ${esc(t.title)}</h2><div class="tablewrap">${t.html}</div></div>`;$("#wbox").scrollIntoView({behavior:"smooth"});});
  document.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{const md=W.models[b.dataset.md];$("#wbox").innerHTML=`<div class="card theory" style="margin-top:16px"><h2 style="font-size:18px;margin-bottom:8px">${esc(md.title)}</h2><div class="model">${hl(esc(md.text))}</div><p class="mute small">Подсвечены слова-связки — используй их в своих текстах. ${wc(md.text)} слов.</p></div>`;$("#wbox").scrollIntoView({behavior:"smooth"});});
  $("#wq").onclick=()=>openMod("wr-q");
  padUI();
}
function wc(t){return(t.trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;}
function hl(t){return t.replace(/\b(On the one hand|On the other hand|In my opinion|To sum up|In conclusion|To conclude|Firstly|Secondly|Moreover|Furthermore|However|For example|For instance|To begin with|Of course|In addition|What is more|Although|although|That is why|Since|which|Then|Suddenly|suddenly|Finally|In the end|At first|For the first two weeks|While|while|Imagine|The main reason|Another reason)\b/g,'<b style="color:var(--lime)">$1</b>');}
const TOPICS=[["Описание картинки: дети убирают класс",50,70],["A) Young people never want to dress the same as their parents",150,160],["B) Famous people deserve a private life",150,160],["C) Computer games teach us nothing",150,160],["D) What would your ideal job be and why?",150,160],["Story: A day you wish you could relive",140,160],["Story: A challenge you overcame",140,160],["Story: If you met your younger self",140,160],["Story: The happiest memory with family or friends",140,160],["Story: The time you felt the most scared",140,160]];
function padUI(){
  let ti=S.padTopic||0,tEnd=0;
  const box=$("#pad");
  const draw=()=>{const T=TOPICS[ti];
    box.innerHTML=`<div class="row"><select id="tp" class="inp" style="font-size:16px;flex:1;min-width:240px">${TOPICS.map((t,k)=>`<option value="${k}" ${k==ti?"selected":""}>${esc(t[0])} (${t[1]}–${t[2]})</option>`).join("")}</select><button class="btn violet small" id="tst">⏱ Таймер 40 мин</button><span class="timer" id="wt">—</span></div>
    <textarea class="pad" id="ta" style="margin-top:12px" placeholder="Пиши здесь. Текст сохраняется в этом браузере.">${esc(S.draft||"")}</textarea>
    <div class="row" style="justify-content:space-between;margin-top:10px"><div><span class="wc" id="wcn">0</span> <span class="mute">слов · нужно ${T[1]}–${T[2]}</span></div><span id="wst" class="pill"></span></div>
    <div class="grid g2" style="margin-top:12px"><div class="check"><b>Самопроверка</b>
    ${["Ответил на ВСЕ части темы","Есть абзацы (3–5)","Есть мнение/вывод в конце","Использовал 4+ связки (However, Moreover…)","Нет сокращений в эссе (do not, I am)","Использовал Present Perfect / пассив / If…would","Проверил артикли и -s у he/she/it","Объём в норме"].map((c,k)=>`<label><input type="checkbox" data-c="${k}"> ${c}</label>`).join("")}</div>
    <div class="mute small"><b>Как оценить себя:</b> каждый пункт ≈ 5 баллов из 40. Отправь текст учителю или сравни с образцом выше. Лучший приём: перепиши образец своими словами на ДРУГУЮ тему — структура запомнится.</div></div>`;
    const ta=$("#ta");const upd=()=>{const n=wc(ta.value);$("#wcn").textContent=n;const st=$("#wst");st.textContent=n<T[1]?`ещё ${T[1]-n}`:n>T[2]+10?"слишком много":"✓ в норме";st.className="pill "+(n<T[1]?"":n>T[2]+10?"pink":"lime");S.draft=ta.value;if(n>S.words){S.words=n;checkBadges();}save();};
    ta.oninput=upd;upd();
    $("#tp").onchange=e=>{ti=+e.target.value;S.padTopic=ti;save();draw();};
    $("#tst").onclick=()=>{tEnd=Date.now()+40*60e3;const iv=setInterval(()=>{const e=$("#wt");if(!e){clearInterval(iv);return;}const s=Math.max(0,Math.round((tEnd-Date.now())/1000));e.textContent=`${s/60|0}:${String(s%60).padStart(2,"0")}`;e.classList.toggle("warn",s<300);if(s<=0){clearInterval(iv);sfx.win();toast("⏰ 40 минут вышли!");}},1000);timers.push(iv);};
  };draw();
}

/* ---------- ПРОБНИКИ ---------- */
function mocks(){
  const rep=MODS["p-rep"];
  V(`<div class="hero"><span class="pill pink">Режим экзамена</span><h1 style="margin:10px 0 6px">Пробники с таймером</h1><p>Как на олимпиаде: подсказок нет, результат и полный разбор — в конце. Лучший балл сохраняется.</p></div>
  <div class="sec"><h2>🥉 Районный формат (30 вопросов, 1/2/3 балла)</h2></div>
  <div class="grid g2">
   <button class="mod" id="mk1"><div class="ic">📜</div><div style="flex:1"><div class="t">Реальный тест прошлого года</div><div class="s">50 баллов · 45 мин · лучший: ${S.best["ex-dist"]||0}</div></div>▶</button>
   <button class="mod" id="mk2"><div class="ic">🆕</div><div style="flex:1"><div class="t">Новый пробник в том же формате</div><div class="s">50 баллов · 45 мин · лучший: ${S.best["ex-m1"]||0}</div></div>▶</button>
  </div>
  <div class="sec"><h2>🏆 Республиканский формат</h2></div>
  <div class="grid g2">
   <button class="mod" id="mk3"><div class="ic">📜</div><div style="flex:1"><div class="t">Республиканский этап 2025–26: Reading + Use of English</div><div class="s">60 баллов (закрытая часть) · 80 мин · лучший: ${S.best["ex-rep"]||0}</div></div>▶</button>
   <button class="mod" id="mk4"><div class="ic">🆕</div><div style="flex:1"><div class="t">Новый пробник повышенной сложности</div><div class="s">Буквы, «настоящее слово», ошибки, формы, знаки · 50 мин · лучший: ${S.best["ex-m2"]||0}</div></div>▶</button>
   <button class="mod" id="mk5"><div class="ic">🎲</div><div style="flex:1"><div class="t">Сборный тест: 30 случайных вопросов из всего сайта</div><div class="s">Каждый раз новый · 30 мин</div></div>▶</button>
  </div>
  <p class="mute small" style="margin-top:16px">Письмо (40 баллов) тренируй во вкладке «Письмо» с таймером 40 минут.</p>`);
  const mkq=(arr,pfx)=>arr.map((x,k)=>Object.assign(norm(x[1],pfx+":"+k),{text:""}));

  const reg=(arr,pfx)=>arr.forEach((x,k)=>{ALLQ[pfx+":"+k]={raw:x[1],text:"",mod:pfx};});
  $("#mk1").onclick=()=>{reg(D.distTest,"ex-dist");runQuiz({title:"Районный 2025",qs:mkq(D.distTest,"ex-dist"),exam:{points:D.distTest.map(x=>x[0]),minutes:45},examKey:"ex-dist",back:mocks});};
  $("#mk2").onclick=()=>{reg(D.mock1,"ex-m1");runQuiz({title:"Пробник 1",qs:mkq(D.mock1,"ex-m1"),exam:{points:D.mock1.map(x=>x[0]),minutes:45},examKey:"ex-m1",back:mocks});};
  $("#mk3").onclick=()=>{const ids=rep.sets.flatMap(s=>s.qids);runQuiz({title:"Республиканский 2025",qs:ids.map(id=>Object.assign(norm(ALLQ[id].raw,id),{text:ALLQ[id].text})),exam:{points:ids.map(()=>1),minutes:80},examKey:"ex-rep",back:mocks});};
  $("#mk4").onclick=()=>{const P=[1,1,2,2,1];const qs=[],pts=[];D.mock2.forEach((s,si)=>s.q.forEach((r,qi)=>{const id="ex-m2:"+si+":"+qi;ALLQ[id]={raw:r,text:s.text||"",mod:"ex-m2"};qs.push(Object.assign(norm(r,id),{text:s.text||""}));pts.push(P[si]);}));runQuiz({title:"Пробник 2",qs,exam:{points:pts,minutes:50},examKey:"ex-m2",back:mocks});};
  $("#mk5").onclick=()=>{const ids=pick(Object.keys(ALLQ).filter(id=>!ALLQ[id].text&&MODS[ALLQ[id].mod]&&MODS[ALLQ[id].mod].stage),30);runQuiz({title:"Сборный",qs:ids.map(id=>Object.assign(norm(ALLQ[id].raw,id),{text:""})),exam:{points:ids.map(()=>1),minutes:30},back:mocks});};
}
MODS["ex-dist"]={stage:1};MODS["ex-m1"]={stage:1};MODS["ex-m2"]={stage:2};

/* ---------- ТЕТРАДЬ ОШИБОК ---------- */
function mistakes(){
  const ids=Object.keys(S.mist).filter(id=>ALLQ[id]).sort((a,b)=>S.mist[b].n-S.mist[a].n);
  const byMod={};ids.forEach(id=>{const m=ALLQ[id].mod;(byMod[m]=byMod[m]||[]).push(id);});
  V(`<div class="hero"><span class="pill pink">Тетрадь ошибок</span><h1 style="margin:10px 0 6px">${ids.length?ids.length+" "+plural(ids.length,["вопрос ждёт","вопроса ждут","вопросов ждут"]):"Ошибок нет 🎉"}</h1><p>Ответишь правильно — вопрос исчезнет. Самые «упрямые» ошибки идут первыми.</p>
  ${ids.length?`<div class="row"><button class="btn pink" id="mAll">🔁 Прорешать (до 15)</button></div>`:""}</div>
  ${Object.keys(byMod).map(m=>`<div class="sec"><h2>${MODS[m]&&MODS[m].icon||"📝"} ${esc(MODS[m]&&MODS[m].title||({"ex-dist":"Районный тест","ex-m1":"Пробник 1","ex-m2":"Пробник 2"}[m]||m))}</h2><span class="mute small">${byMod[m].length}</span></div>${byMod[m].slice(0,8).map(id=>mistCard(norm(ALLQ[id].raw,id),null)).join("")}`).join("")}`);
  const b=$("#mAll");if(b)b.onclick=()=>runQuiz({title:"Ошибки",qs:ids.slice(0,15).map(id=>Object.assign(norm(ALLQ[id].raw,id),{text:ALLQ[id].text})),back:mistakes});
}
function plural(n,f){const a=n%10,b=n%100;return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2];}

tabs();topbar();

})();

<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Олимпиада по английскому · 8 класс · Подготовка на 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --disp:"Unbounded","Nunito",system-ui,sans-serif;
  --bg:#0e1124; --bg2:#151a36; --card:#1b2147; --card2:#232a58; --line:#2f3770;
  --ink:#eef0ff; --mute:#a3a9d6; --lime:#c6ff3d; --violet:#8b7bff; --pink:#ff5fa2;
  --ok:#2fe39a; --bad:#ff6b6b; --gold:#ffc83d; --sky:#4cc9ff;
  --r:18px; --shadow:0 6px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 600px at 90% -10%,#2a1f6b 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0f3b4d 0%,transparent 55%),var(--bg);background-attachment:fixed}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--sky)}
code{background:#0b0e1f;padding:1px 6px;border-radius:6px;color:var(--lime);font-size:.92em}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 110px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#0e1124;border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-family:var(--disp);font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{background:var(--lime);color:#0e1124;border-radius:9px;padding:3px 8px}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.cbtn:hover{border-color:var(--violet)}
.xpbar{width:70px;height:7px;background:#0b0e1f;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--lime))}
nav.tabs{display:flex;gap:6px;max-width:1080px;margin:0 auto;padding:0 16px 10px;overflow-x:auto}
nav.tabs button{padding:8px 14px;border-radius:12px;font-weight:800;color:var(--mute);white-space:nowrap}
nav.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--lime)}
@media (max-width:860px){
  .qlayout.withText .qcard{order:-1}
  .qlayout.withText .passage{max-height:55vh}
}
@media (max-width:720px){
  nav.tabs button{flex:1;min-width:0}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(14,17,36,.96);border-top:1px solid var(--line);padding:8px;justify-content:space-between;z-index:30}
  nav.tabs button{padding:6px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .logo span.full{display:none}
  .chip .lbl{display:none}
  .xpbar{width:44px}
}
nav.tabs .ico{font-size:18px}

/* cards & grids */
.hero{background:linear-gradient(135deg,#2b2370,#16224d 60%);border:1px solid var(--line);border-radius:26px;padding:24px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,4vw,38px);line-height:1.1}
.hero p{color:var(--mute);max-width:620px}
.hero .big{position:absolute;right:-10px;bottom:-30px;font-family:var(--disp);font-size:150px;color:rgba(198,255,61,.08);font-weight:800;pointer-events:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:17px;margin-bottom:6px}
.mute{color:var(--mute)}
.small{font-size:14px}
.sec{margin:28px 0 12px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:20px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--card2);color:var(--mute)}
.pill.lime{background:var(--lime);color:#0e1124}
.pill.pink{background:var(--pink);color:#fff}
.pill.violet{background:var(--violet);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:900;background:var(--lime);color:#0e1124;box-shadow:0 4px 0 #7fa61d;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7fa61d}
.btn.sec2{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 #11152e;border:1px solid var(--line)}
.btn.violet{background:var(--violet);color:#fff;box-shadow:0 4px 0 #4b3fb3}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a52f62}
.btn.small{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* stage map */
.mod{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .1s,border-color .1s;text-align:left;width:100%}
.mod:hover{transform:translateY(-2px);border-color:var(--violet)}
.mod .ic{width:52px;height:52px;flex:0 0 52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--card2)}
.mod .t{font-weight:800;line-height:1.25}
.mod .s{font-size:13px;color:var(--mute)}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.stars .off{color:#3a427e}
.mod.next{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,61,.15)}
.prog{height:10px;background:#0b0e1f;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--lime));transition:width .4s}

/* theory */
.theory .rule,.theory .trap,.theory .model{border-radius:14px;padding:12px 14px;margin:10px 0}
.theory .rule{background:#141a3a;border-left:5px solid var(--sky)}
.theory .trap{background:#2a1430;border-left:5px solid var(--pink)}
.theory .model{background:#13301f;border-left:5px solid var(--ok);white-space:pre-line}
.theory table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;background:#121735;border-radius:12px;overflow:hidden}
.theory th{background:#262e66;text-align:left;padding:8px 10px}
.theory td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
.theory table.irr td{font-size:14px}
.tablewrap{overflow-x:auto}
.theory b{color:#fff}
.theory u{text-decoration-color:var(--lime);text-decoration-thickness:2px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .prog{flex:1;height:14px}
.combo{font-family:var(--disp);font-size:14px;padding:4px 10px;border-radius:999px;background:var(--card2);white-space:nowrap}
.combo.hot{background:linear-gradient(90deg,#ff8a00,#ff3d77);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.qlayout{display:grid;gap:16px}
.qlayout.withText{grid-template-columns:1.1fr 1fr}
@media (max-width:860px){.qlayout.withText{grid-template-columns:1fr}}
.passage{background:#f6f3ea;color:#1d1b16;border-radius:var(--r);padding:16px 18px;max-height:70vh;overflow:auto;font-family:Georgia,serif;font-size:16px;line-height:1.6}
.passage h4{font-family:var(--disp);margin:0 0 8px;font-size:16px}
.passage .opts{background:#ebe5d4;border-radius:10px;padding:10px;margin-top:10px;font-family:Nunito;font-size:15px}
.passage details summary{cursor:pointer}
details.ptoggle>summary{font-weight:800;cursor:pointer;color:var(--sky);margin-bottom:6px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.qtext{font-size:20px;font-weight:700;margin-bottom:16px}
.qtext .sign{font-weight:600;font-size:16px;background:#fff7d6;color:#3a2f00;border:3px dashed #e3b400;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-family:Nunito}
.qtext .text{font-weight:500;font-size:16px;background:#f6f3ea;color:#1d1b16;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-family:Georgia,serif;line-height:1.55}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;box-shadow:0 4px 0 #11152e;transition:transform .06s}
.opt:hover{border-color:var(--violet)}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:#0b0e1f;display:grid;place-items:center;font-size:13px;color:var(--mute)}
.opt.ok{border-color:var(--ok);background:#123b2c}
.opt.bad{border-color:var(--bad);background:#3b1620;animation:shake .35s}
.opt.dim{opacity:.55}
.opts.letters{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.opts.letters .opt{justify-content:center;font-size:20px}
.opts.letters .opt .k{display:none}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.inp{width:100%;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:#0b0e1f;color:var(--ink);font-family:inherit;font-weight:700}
.inp:focus{outline:none;border-color:var(--violet)}
.inp.ok{border-color:var(--ok)} .inp.bad{border-color:var(--bad)}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;animation:pop .25s}
.fb.ok{background:#0f3a29;border:1px solid #1f7a55}
.fb.bad{background:#3a141d;border:1px solid #8a2b3c}
.fb .h{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.fb .why{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px;margin-top:8px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.order-pool,.order-ans{display:flex;flex-direction:column;gap:8px;min-height:50px}
.order-ans{background:#0b0e1f;border:2px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.order-item{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px}
.order-item .n{display:inline-block;min-width:24px;font-weight:900;color:var(--lime)}

/* results */
.res{text-align:center;padding:26px}
.res .score{font-family:var(--disp);font-size:56px;color:var(--lime)}
.mist{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:10px;text-align:left}
.mist .q{font-weight:700}
.mist .a{color:var(--ok)} .mist .y{color:var(--bad)}

/* flashcards */
.flash{perspective:1000px;height:260px;cursor:pointer;max-width:520px;margin:0 auto}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.flash .front{background:linear-gradient(135deg,#3b2fa8,#1f2a66)}
.flash .back{background:linear-gradient(135deg,#13512f,#123a4d);transform:rotateY(180deg)}
.flash .w{font-family:var(--disp);font-size:30px}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.memory{grid-template-columns:repeat(3,1fr)}}
.mcard{min-height:84px;border-radius:14px;background:var(--card2);border:2px solid var(--line);font-weight:800;font-size:14px;padding:8px;box-shadow:0 4px 0 #11152e}
.mcard.sel{border-color:var(--violet);background:#2c2a6e}
.mcard.done{border-color:var(--ok);background:#123b2c;opacity:.6}
.mcard.bad{border-color:var(--bad);animation:shake .35s}

/* writing */
textarea.pad{width:100%;min-height:300px;background:#f6f3ea;color:#1d1b16;border-radius:16px;border:0;padding:16px;font-family:Georgia,serif;font-size:17px;line-height:1.6}
.wc{font-family:var(--disp);font-size:22px}
.check label{display:flex;gap:8px;align-items:flex-start;padding:5px 0}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,6,15,.82);display:grid;place-items:center;z-index:100;padding:16px}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;max-width:460px;width:100%;text-align:center}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--gold);color:#1d1600;font-weight:900;padding:10px 18px;border-radius:999px;z-index:120;animation:pop .25s;box-shadow:var(--shadow)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:110}
.badge{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:14px;padding:10px 12px}
.badge .e{font-size:28px}
.badge.off{opacity:.35;filter:grayscale(1)}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),#0b0e1f 0);display:grid;place-items:center}
.ring>div{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--disp);font-size:14px}
.timer{font-family:var(--disp);font-size:15px;padding:4px 10px;border-radius:999px;background:#0b0e1f}
.timer.warn{color:var(--bad)}
kbd{background:#0b0e1f;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:13px}
.back{color:var(--mute);font-weight:800;margin-bottom:10px;display:inline-flex;gap:6px}
.back:hover{color:var(--ink)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:10px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--violet);color:#fff}
</style></head>
<body>
<header class="top"><div class="in"><div class="logo"><b>EN</b><span class="full">Олимпиада · 8 класс</span></div><div class="chips" id="chips"></div></div>
<nav class="tabs" id="tabs"></nav></header>
<main class="wrap" id="view"></main>
<script>
const D={};
// ГРАММАТИКА — ЭТАП 1 (районный). Формат вопроса:
// MC:    ["вопрос", ["ВЕРНЫЙ","неверный1",...], "объяснение", ["почему неверный1",...]]
// ВВОД:  ["вопрос", "=ответ|вариант2", "объяснение"]
D.grammar1 = [
{
id:"g-pp", icon:"⏳", title:"Present Perfect vs Past Simple",
theory:`
<div class="rule"><b>Present Perfect</b> = <code>have / has + V3</code>. Связь прошлого с <u>настоящим</u>: опыт, результат, незаконченный период.</div>
<table><tr><th>Present Perfect</th><th>Past Simple</th></tr>
<tr><td>already, just, yet, ever, never, so far, recently, lately, before (в конце), since, for, how long, today / this week (период ещё идёт)</td><td>yesterday, ago, last week/year, in 2019, when I was 7, then, What time…? When…?</td></tr>
<tr><td>I <b>have</b> already <b>done</b> it.<br>She <b>has known</b> him her whole life.</td><td>I <b>did</b> it yesterday.<br>We <b>met</b> two years ago.</td></tr></table>
<div class="rule"><b>since / for</b>: <code>since</code> + момент (since Monday, since 2020, since last summer, since I was a child). <code>for</code> + отрезок (for two hours, for ages, for a long time).</div>
<div class="rule"><b>Сокращения:</b> 've = have · 's = has <i>или</i> is · 'd = had <i>или</i> would · 're = are · 'm = am.</div>
<div class="rule"><b>been / gone:</b> He <b>has gone</b> to Paris — уехал и сейчас там. He <b>has been</b> to Paris — был и вернулся (опыт).</div>
<div class="trap">⚠ Ловушки олимпиады: <br>✗ I have seen him <s>yesterday</s> → ✓ I saw him yesterday.<br>✗ I didn't see him before → ✓ I <b>haven't seen</b> him before.<br>✗ She has <s>know</s> → ✓ She has <b>known</b> (V3!).<br>✗ <s>Have</s> anyone read…? → ✓ <b>Has</b> anyone read…? (anyone, everyone, someone, nobody = он/она → has).<br>✓ It's the first time I <b>have eaten</b> sushi.</div>`,
q:[
["She ___ already ___ her homework.",["has / done","have / done","will / do","were / doing"],"Already → Present Perfect. She (3-е лицо ед. ч.) → has + V3 (done).",["have — для I/you/we/they; she требует has.","will do — будущее, а already указывает на уже свершившийся результат.","were doing — Past Continuous, к тому же were не сочетается с she."]],
["I haven't seen my best friend ___ last summer.",["since","for","during","from"],"Last summer — точка во времени, начало периода → since.",["for + длительность (for two months).","during = «в течение» события (during the summer), не используется с Present Perfect для «с того момента».","from нужно в паре from…to/until."]],
["She ___ him her whole life.",["has known","have known","has know","have knew"],"Состояние длится до сих пор → Present Perfect; she → has; know – knew – known → known.",["have — не для she.","know — первая форма; после has нужна V3.","have + knew — неверное подлежащее и V2 вместо V3."]],
["I ___ Japanese food before.",["have eaten","has eaten","am eating","eat"],"Before в конце + опыт → Present Perfect: I have eaten.",["has — только для he/she/it.","am eating — сейчас ем, не опыт.","eat — Present Simple, не говорит об опыте до этого момента."]],
["___ anyone read the announcement?",["Has","Have","Do","Were"],"Anyone согласуется как 3-е лицо ед. ч. → Has anyone read…? (read — V3, читается [red]).",["Have — множ. число; anyone грамматически единственное.","Do + read = «читает ли вообще», не подходит по смыслу результата.","Were + read даёт пассив «были прочитаны», но subject — anyone (человек)."]],
["What is the contraction of the verb <b>have</b>?",["'ve","'d","'s","'re"],"Have → 've (I've, we've). 's = has/is, 'd = had/would, 're = are.",["'d = had / would.","'s = has / is, но не have.","'re = are."]],
["We ___ in this town since we were children.",["have lived","lived","live","are living"],"Since + момент → Present Perfect (действие идёт до сих пор).",["Past Simple означал бы, что мы там больше не живём, а since требует связи с настоящим.","Present Simple с since не употребляется.","Present Continuous с since не употребляется."]],
["I ___ him yesterday at the cinema.",["saw","have seen","have saw","had seen"],"Yesterday — конкретное прошлое → Past Simple.",["Present Perfect нельзя с yesterday.","have + V2 — ошибка формы.","Past Perfect нужен только для «раньше другого действия в прошлом»."]],
["I've got no idea about this teacher. I ___ him before.",["haven't seen","didn't see","don't see","wasn't seeing"],"Before в конце = «никогда до сих пор» → Present Perfect.",["Past Simple отсылает к конкретному моменту; здесь опыт до сейчас.","Present Simple не выражает опыт.","Past Continuous — процесс в момент прошлого."]],
["My dad isn't here. He ___ to the bank.",["has gone","has been","went","goes"],"Его нет сейчас → has gone (ушёл и ещё там).",["has been = сходил и вернулся, а он не здесь.","went — Past Simple без связи с настоящим, не объясняет «его сейчас нет».","goes — привычка."]],
["How long ___ you known each other?",["have","did","do","are"],"How long + know (глагол состояния) → How long have you known…?",["did — Past Simple, тогда было бы «know», и смысл «знали (раньше)».","do — Present Simple нельзя с how long для периода до сейчас.","are known — пассив, не по смыслу."]],
["It's the first time I ___ a horse.",["have ridden","rode","ride","had ridden"],"It's the first time + Present Perfect. ride – rode – ridden.",["После It's the first time Past Simple — ошибка.","Present Simple — ошибка.","Past Perfect — после It WAS the first time."]],
["They ___ the film yet.",["haven't watched","didn't watch","don't watch","weren't watched"],"Yet в отрицании → Present Perfect.",["Yet не сочетается с Past Simple в британском стандарте олимпиады.","Present Simple — привычка.","Пассив, неверный по смыслу."]],
["Type the correct form: Ann ___ (be) to London three times.","=has been","Опыт (three times) → Present Perfect: has been."],
["Type the correct form: We ___ (not/see) him since Monday.","=haven't seen|have not seen","Since Monday → Present Perfect, отрицание: haven't seen."],
["Choose the correct sentence.",["I have just finished my project.","I have finished my project yesterday.","I just have finished my project.","I finished my project since Monday."],"Just стоит между have и V3. С yesterday — Past Simple. Since — только с Present Perfect.",["yesterday + Present Perfect — грубая ошибка.","Порядок слов: have just finished.","since требует Present Perfect."]]
]},

{
id:"g-past", icon:"🎞️", title:"Past Continuous и Past Perfect",
theory:`
<div class="rule"><b>Past Continuous</b> = <code>was / were + V-ing</code> — процесс в момент прошлого. <br>I <b>was doing</b> my homework <b>when</b> my friend <b>called</b>. (длинное действие + короткое)</div>
<div class="rule"><b>while</b> + длительное: <i>While I was cooking, he was reading.</i> <b>when</b> + короткое: <i>…when the phone rang.</i></div>
<div class="rule"><b>Past Perfect</b> = <code>had + V3</code> — действие <u>раньше</u> другого действия в прошлом.<br>When I tried to call you, you <b>had</b> already <b>gone</b> to bed.<br>She <b>had finished</b> her work when the meeting started.</div>
<table><tr><th>Схема</th><th>Пример</th></tr>
<tr><td>by the time / before / after / already / when (раньше)</td><td>By the time we arrived, the film <b>had started</b>.</td></tr>
<tr><td>Пассив Past Perfect: had been + V3</td><td>The problem <b>had been solved</b> before the teacher came.</td></tr></table>
<div class="trap">⚠ still / yet / already:<br>✓ Ann was <b>still</b> working (всё ещё — в утверждении).<br>✓ Has he finished <b>yet</b>? He hasn't finished <b>yet</b>. (вопрос/отрицание, в конце)<br>✓ He has <b>already</b> finished. (утверждение, перед V3)<br>✗ Ann was <s>yet</s> working.</div>`,
q:[
["When I ___ to call you last night, you ___ gone to bed.",["tried / had","tried / have","was trying / were","have tried / had been"],"Сначала ты лёг (раньше) → had gone; потом я позвонил → tried (Past Simple).",["have gone — Present Perfect не сочетается с last night.","were gone — неверная форма.","have tried нельзя с last night; had been gone — бессмысленно."]],
["I ___ my homework when my friend called me.",["was doing","did","have done","had done"],"Длительное действие прервано коротким (called) → Past Continuous.",["did — тогда я сделал бы ВСЁ при звонке — не про процесс.","Present Perfect не сочетается с прошлым моментом.","had done = закончил ДО звонка; в задании — в процессе."]],
["When I went to bed, Ann was ___ working.",["still","yet","already","just"],"Всё ещё (в утвердительном) → still.",["yet — только в вопросах и отрицаниях.","already = уже (законченное действие), не процесс.","just — только что; с was working звучит неестественно."]],
["She had already ___ her work when the meeting started.",["finished","finish","finishing","was finished"],"Had + V3 → finished.",["После had нужна V3.","-ing после had — ошибка.","had already was — две вспомогательных формы подряд."]],
["The problem ___ before the teacher came.",["had been solved","has been solved","was solving","solved"],"Задачу решили (пассив) ДО прихода учителя → Past Perfect Passive: had been solved.",["Present Perfect не стыкуется с came.","was solving — актив: «задача решала» — бессмыслица.","solved — актив: задача сама решила."]],
["The tickets ___ out before we arrived at the cinema.",["had sold","have sold","sold out","were sell"],"Раньше нашего прихода → Past Perfect. Sell out (распродаться) — без пассива: The tickets had sold out. (had been sold out тоже принимают.)",["Present Perfect не сочетается с arrived.","out уже стоит в предложении — получится sold out out.","were sell — неверная форма."]],
["While Mum ___ dinner, Dad was watching TV.",["was cooking","cooked","had cooked","cooks"],"Два параллельных процесса с while → оба Past Continuous.",["Past Simple не передаёт процесс параллельно с was watching.","Past Perfect = раньше, а тут одновременно.","Present Simple — не то время."]],
["By the time we got to the station, the train ___.",["had left","left","has left","was leaving"],"By the time + Past Simple → в главной части Past Perfect.",["left означало бы «ушёл, когда мы пришли» — последовательность потеряна.","Present Perfect нельзя.","was leaving = как раз отправлялся — меняет смысл; классический ключ — had left."]],
["Type: I ___ (read) a book when the lights went out.","=was reading","Процесс в момент прошлого, прерванный коротким действием → was reading."],
["Type: After she ___ (finish) dinner, she went for a walk.","=had finished","After + раньше другого действия → had finished."],
["Have you finished your project ___?",["yet","still","already","ago"],"Вопрос «уже?» в Present Perfect → yet в конце.",["still — «всё ещё».","already в вопросе = удивление «уже?!», в стандартном ключе — yet.","ago — только с Past Simple."]],
["We arrived ___ Paris early in the morning.",["in","to","at","into"],"Arrive in + город/страна; arrive at + здание/станция. Arrive TO — ошибка всегда.",["arrive to не существует.","at — для точки (at the airport), не для города.","into — движение внутрь, с arrive не употребляется."]]
]},

{
id:"g-fut", icon:"🔮", title:"Будущее: will / be going to / Present Continuous",
theory:`
<table><tr><th>Форма</th><th>Когда</th><th>Пример</th></tr>
<tr><td><b>will</b> + V</td><td>Спонтанное решение, обещание, мнение (I think, probably)</td><td>I'm cold. — I'<b>ll close</b> the window.</td></tr>
<tr><td><b>be going to</b> + V</td><td>Намерение ИЛИ прогноз по признакам «вижу сейчас»</td><td>Look at those clouds! It <b>is going to rain</b>.</td></tr>
<tr><td><b>Present Continuous</b></td><td>Договорённость, план с временем</td><td>Louise and Bill <b>are flying</b> to Rome tonight.</td></tr>
<tr><td><b>Present Simple</b></td><td>Расписание</td><td>The bus <b>leaves</b> at 8:30.</td></tr></table>
<div class="trap">⚠ После when / if / before / after / as soon as / until в будущем — <b>Present Simple</b>: I'll call you when I <b>get</b> home (✗ will get).</div>`,
q:[
["Look at those dark clouds! It ___ rain soon!",["is going to","will","going to","was going to"],"Прогноз по признаку, который видно сейчас (clouds) → be going to.",["will — без видимых признаков, просто мнение.","Без is — грамматическая ошибка.","was going to — прошлое."]],
["Louise and Bill ___ to Rome tonight.",["are flying","flew","fly","flies"],"Запланированное с конкретным временем (tonight) → Present Continuous.",["flew — прошедшее, не сочетается с tonight.","fly — расписание бывает у поездов, не у людей.","flies — для 3-го лица ед. ч."]],
["The phone is ringing. — I ___ it!",["'ll answer","'m going to answer","answer","answered"],"Решение в момент речи → will.",["going to — заранее обдуманное намерение.","Present Simple — не для спонтанных решений.","Прошедшее — бессмысленно."]],
["I'll phone you as soon as I ___ home.",["get","will get","got","am getting"],"После as soon as / when / if — Present Simple для будущего.",["will после as soon as — ошибка.","got — прошедшее.","Continuous тут не нужен."]],
["The train ___ at 6:15 tomorrow morning.",["leaves","is leave","will leaving","leave"],"Расписание → Present Simple: leaves.",["is leave — смешение форм.","will leaving — после will нужен инфинитив без -ing.","leave — нужна -s для the train."]],
["I've decided. I ___ learn Chinese next year.",["am going to","will","learn","am learning"],"Решение уже принято заранее (I've decided) → going to.",["will — для решения в момент речи.","Present Simple — не выражает намерение.","Present Continuous — договорённость с другими, а не личное намерение (здесь не подходит)."]],
["Type: I think she ___ (pass) the exam — she's very clever.","=will pass|'ll pass","I think + мнение о будущем → will pass."]
]},

{
id:"g-passive", icon:"🔁", title:"Пассивный залог (Passive Voice)",
theory:`
<div class="rule">Формула: <code>be (в нужном времени) + V3</code>. Важно ЧТО сделано, а не КТО.</div>
<table><tr><th>Время</th><th>Пассив</th></tr>
<tr><td>Present Simple</td><td>English <b>is spoken</b> here.</td></tr>
<tr><td>Past Simple</td><td>The house <b>was built</b> in 1935.</td></tr>
<tr><td>Present Perfect</td><td>Many missions <b>have been launched</b>.</td></tr>
<tr><td>Past Perfect</td><td>The tickets <b>had been sold</b>.</td></tr>
<tr><td>Future</td><td>It <b>will be done</b> tomorrow.</td></tr>
<tr><td>Модальные</td><td>It <b>must be finished</b>. / It <b>can be used</b>.</td></tr>
<tr><td>Continuous</td><td>The road <b>is being repaired</b>.</td></tr></table>
<div class="rule"><b>by</b> — кем: written <b>by</b> a famous historian. <b>with</b> — чем (инструмент): cut <b>with</b> a knife.</div>
<div class="trap">⚠ Классика олимпиады: ✗ It <s>is build</s> in 1935 → ✓ It <b>was built</b> in 1935 (год в прошлом + V3).<br>✗ The window <s>was broke</s> → ✓ was <b>broken</b>.</div>`,
q:[
["This house is quite old. It ___ in 1935.",["was built","is build","is built","built"],"1935 — прошлое, дом построили (пассив) → was built.",["is build — неверное время и форма (нужна V3).","is built — настоящее время, а год прошедший.","built — актив: «дом построил»."]],
["The book ___ I borrowed from the library was written by a famous historian.",["which","who","where","whose"],"Предмет (book) → which/that.",["who — для людей.","where — для мест.","whose — «чей», нужен существительное после."]],
["Many technologies we use today ___ developed as a result of space research.",["have been","are","we","had been"],"Результат к сегодняшнему дню (today) → Present Perfect Passive: have been developed.",["are developed — «разрабатываются регулярно», противоречит as a result of.","we — грамматически бессмысленно.","had been — Past Perfect, нет второго прошлого действия."]],
["Equipment that ___ designed to work in extreme conditions.",["is","was","were","has"],"Общий факт об оборудовании → Present Simple Passive: is designed.",["was — прошлое, а текст про настоящее.","were — множественное число, а equipment неисчисляемое.","has designed — актив: оборудование само проектирует."]],
["In recent years, many space missions ___ launched to explore Mars.",["have been","are","were being","had"],"In recent years → Present Perfect; missions launched by people → passive: have been launched.",["are launched — регулярное действие, но in recent years требует Present Perfect.","were being launched — процесс в момент прошлого, не подходит.","had launched — актив и Past Perfect."]],
["English ___ all over the world.",["is spoken","speaks","is speaking","spoken"],"Языком говорят → пассив Present Simple.",["speaks — язык сам говорит.","is speaking — актив Continuous.","spoken без is — нет сказуемого."]],
["The road ___ at the moment, so we have to go another way.",["is being repaired","is repaired","repairs","has repaired"],"At the moment + пассив → Present Continuous Passive: is being repaired.",["is repaired — регулярно/вообще, а не сейчас.","repairs — актив, дорога сама чинит.","has repaired — актив."]],
["Type: The letter ___ (send) yesterday.","=was sent","Yesterday + пассив → was sent (send – sent – sent)."],
["Type: The homework must ___ (finish) by Friday.","=be finished","Модальный пассив: must be + V3."],
["The Mona Lisa was painted ___ Leonardo da Vinci.",["by","with","from","of"],"Исполнитель действия в пассиве → by.",["with — инструмент (with a brush).","from — откуда.","of — принадлежность."]]
]},

{
id:"g-cond", icon:"🔀", title:"Условные предложения 0, 1, 2",
theory:`
<table><tr><th>Тип</th><th>If-часть</th><th>Главная часть</th><th>Смысл</th></tr>
<tr><td>0</td><td>Present Simple</td><td>Present Simple</td><td>Всегда так (факт): If you heat ice, it melts.</td></tr>
<tr><td>1</td><td>Present Simple</td><td>will + V</td><td>Реально в будущем: If she <b>studies</b> hard, she <b>will pass</b>.</td></tr>
<tr><td>2</td><td>Past Simple (were)</td><td>would + V</td><td>Нереально сейчас: If I <b>knew</b> his number, I <b>would call</b> him.</td></tr></table>
<div class="rule">Во 2-м типе: If I <b>were</b> you… (для всех лиц допустимо were; в разговорном — was). If I <b>was</b> braver, I <b>would</b> try…</div>
<div class="rule"><b>unless</b> = if not: Unless you hurry, you'll be late.</div>
<div class="trap">⚠ НИКОГДА will/would в if-части: ✗ If I <s>would be</s> braver… ✗ If she <s>will study</s>…<br>⚠ ✗ If I <s>know</s> his number, I would call → ✓ If I <b>knew</b>…</div>`,
q:[
["If she ___ hard, she ___ the exam.",["studies / will pass","will study / passes","study / will pass","studies / would pass"],"1-й тип: If + Present Simple, will + V. She → studies.",["will в if-части запрещён.","she study — пропущена -s.","would — 2-й тип; смешивать Present + would нельзя."]],
["Choose the correct Second Conditional sentence.",["If I was braver I would try to eat grasshoppers.","If I am braver I would try to eat grasshoppers.","If I would be braver I would try to eat grasshoppers.","If I wasn't braver I would try to eat grasshoppers."],"2-й тип: If + Past Simple, would + V. Смысл: «Будь я смелее — попробовал бы».",["am + would — смешение 1 и 2 типа.","would в if-части — ошибка.","Грамматически верно, но смысл нелогичен: «если бы я НЕ был смелее, я бы попробовал»."]],
["If I ___ his number, I would call him.",["knew","know","would know","had know"],"2-й тип → If + Past Simple: knew.",["know — 1-й тип, не сочетается с would.","would в if-части нельзя.","had know — неверная форма."]],
["If I ___ you, I would apologise.",["were","am","will be","be"],"Устойчиво: If I were you… (совет).",["am — настоящее.","will — в if-части нельзя.","be — инфинитив."]],
["If you heat water to 100°C, it ___.",["boils","would boil","will boiled","boiled"],"Научный факт → 0-й тип: Present + Present.",["would — нереальность, а это факт.","will boiled — ошибка формы.","boiled — прошедшее."]],
["___ you hurry, you'll miss the bus.",["Unless","If","When","Because"],"Unless = if not: «Если не поторопишься — опоздаешь».",["If you hurry, you'll miss — нелогично.","When you hurry… — тоже нелогично.","Because — причина, нелогично."]],
["Type: If it ___ (rain) tomorrow, we will stay at home.","=rains","1-й тип: If + Present Simple → rains."],
["Type: If I had more time, I ___ (learn) to play the guitar.","=would learn|'d learn","2-й тип: would + V → would learn."],
["What would you do if you ___ a million dollars?",["won","win","will win","would win"],"Гипотетика → 2-й тип: won.",["win — 1-й тип с would не сочетается.","will — в if-части нельзя.","would — в if-части нельзя."]]
]},

{
id:"g-rep", icon:"💬", title:"Косвенная речь: say / tell",
theory:`
<div class="rule"><b>say</b> (something) / say <b>to</b> somebody — <b>tell somebody</b> (something). <br>✓ He <b>told me</b> he was busy. ✓ He <b>said</b> he was busy. ✓ He <b>said to me</b>…<br>✗ He <s>said me</s>… ✗ He <s>told</s> that…(без адресата)</div>
<table><tr><th>Прямая речь</th><th>Косвенная (после said/told)</th></tr>
<tr><td>Present Simple: "I like it"</td><td>Past Simple: he liked it</td></tr>
<tr><td>Present Continuous: "I am going"</td><td>Past Continuous: he was going</td></tr>
<tr><td>Past Simple / Present Perfect</td><td>Past Perfect: had done</td></tr>
<tr><td>will → would; can → could; must → had to</td><td>He said he <b>would</b> come.</td></tr>
<tr><td>today → that day; tomorrow → the next day; yesterday → the day before; here → there; this → that; ago → before</td><td></td></tr></table>
<div class="rule">Вопросы: прямой порядок слов! "Where do you live?" → She asked me where <b>I lived</b>. Да/нет вопросы → if/whether: He asked <b>if</b> I was ready.</div>
<div class="rule">Просьбы/приказы: ask/tell + somebody + <b>to</b> do / <b>not to</b> do.</div>`,
q:[
["Choose the correct reported speech sentence.",["He told me he was going to the opera.","He said me he was going to the opera.","He told he is going to the opera.","He told me he is going to the opera."],"Tell + кто (me) + сдвиг времени: is going → was going.",["said me — без to нельзя.","told без адресата нельзя.","Без сдвига времени (is) — ошибка в олимпиадном ключе."]],
["She ___ that she was tired.",["said","told","talked","spoke"],"Said + that-clause без адресата. Told потребовал бы told me/us.",["told без объекта — ошибка.","talk не вводит прямую передачу слов.","speak — тоже не вводит that-clause."]],
["\"I will help you,\" he said. → He said that he ___ help me.",["would","will","can","is going"],"Will → would при сдвиге.",["will — без сдвига.","can — другое значение.","is going — неверная форма и без to."]],
["She asked me where ___.",["I lived","did I live","do I live","I live"],"Косвенный вопрос: прямой порядок слов + сдвиг: where I lived.",["Вопросительный порядок в косвенном вопросе — ошибка.","Тоже вопросительный порядок.","Без сдвига времени после asked."]],
["The teacher told us ___ talk during the test.",["not to","don't","to not","no"],"Отрицательная просьба: tell sb not to do.",["don't — прямая речь.","to not — неправильный порядок.","no — неверно."]],
["\"I saw him yesterday,\" she said. → She said she ___ him the day before.",["had seen","saw","has seen","sees"],"Past Simple → Past Perfect; yesterday → the day before.",["Без сдвига (допустимо в речи, но в олимпиадном тесте — ошибка).","Present Perfect — не после said.","sees — настоящее."]],
["Type: \"Are you ready?\" he asked. → He asked ___ I was ready.","=if|whether","Общий вопрос → if / whether."]
]},

{
id:"g-rel", icon:"🔗", title:"Относительные местоимения: who / which / whose…",
theory:`
<table><tr><th>Слово</th><th>Для чего</th><th>Пример</th></tr>
<tr><td><b>who</b></td><td>люди</td><td>I met a man <b>who</b> knows you.</td></tr>
<tr><td><b>which</b></td><td>вещи, животные</td><td>The book <b>which</b> I borrowed…</td></tr>
<tr><td><b>that</b></td><td>люди и вещи (только в определяющих, без запятых)</td><td>This is the book <b>that</b> I read.</td></tr>
<tr><td><b>whose</b></td><td>чей (+ существительное)</td><td>The boy <b>whose</b> bike was stolen…</td></tr>
<tr><td><b>where</b></td><td>место</td><td>The town <b>where</b> I was born.</td></tr>
<tr><td><b>when</b></td><td>время</td><td>The day <b>when</b> we met.</td></tr></table>
<div class="trap">⚠ ✗ I met a man <s>whose</s> knows you → ✓ <b>who</b> knows you (после whose нужно существительное).<br>⚠ who's = who is; whose = чей.<br>⚠ После запятой that НЕ используется: My brother, <b>who</b> lives in Almaty, …</div>`,
q:[
["I met a man ___ knows you.",["who","whose","which","where"],"Человек + глагол сразу после → who.",["whose требует существительного: whose son knows you.","which — для предметов.","where — для мест."]],
["This is the girl ___ mother is a doctor.",["whose","who","who's","which"],"Чья мама → whose + существительное.",["who mother — нет «чьей».","who's = who is.","which — не для людей."]],
["That's the café ___ we first met.",["where","which","who","when"],"Место, где → where.",["which we first met — нужен предлог: which we first met at/in.","who — для людей.","when — время."]],
["Do you remember the day ___ we went to the mountains?",["when","where","which","who"],"День, когда → when.",["where — место.","which we went — без предлога неверно.","who — люди."]],
["My sister, ___ lives in Astana, is a nurse.",["who","that","which","whose"],"После запятой (дополнительная информация) — who, НЕ that.",["that после запятой нельзя.","which — для вещей.","whose — чей."]],
["Type: This is the book ___ was written by my favourite author.","=which|that","Предмет → which / that."]
]},

{
id:"g-modal", icon:"🗝️", title:"Модальные глаголы",
theory:`
<table><tr><th>Глагол</th><th>Значение</th><th>Пример</th></tr>
<tr><td>can / could</td><td>умение (сейчас / в прошлом), просьба</td><td>When I was seven I <b>could</b> swim. <b>Can</b> I borrow your umbrella?</td></tr>
<tr><td>must</td><td>сильная необходимость, уверенность</td><td>Astronauts <b>must</b> have special preparation.</td></tr>
<tr><td>mustn't</td><td>ЗАПРЕТ</td><td>You <b>mustn't</b> be late.</td></tr>
<tr><td>have to / don't have to</td><td>вынужден / НЕ обязательно</td><td>You <b>don't have to</b> come (можно не приходить).</td></tr>
<tr><td>should</td><td>совет</td><td>You <b>should</b> see a doctor.</td></tr>
<tr><td>may / might / could</td><td>возможность</td><td>Mars <b>could</b> have had water.</td></tr></table>
<div class="rule">После модального — инфинитив БЕЗ to: can swim (✗ can to swim). Исключения: have to, ought to.</div>
<div class="trap">⚠ mustn't ≠ don't have to! mustn't — нельзя; don't have to — необязательно.</div>`,
q:[
["When I was seven I ___ swim well.",["could","can","should","must"],"Умение в прошлом → could.",["can — настоящее.","should — совет.","must — обязанность."]],
["___ I borrow your umbrella, please? It's raining.",["Can","Must","Can't","Should"],"Вежливая просьба → Can I…?",["Must I — «обязан ли я».","Can't I — звучит как упрёк.","Should I — «стоит ли мне»."]],
["Hurry up! You ___ be late for school.",["mustn't","must","can","don't have to"],"Hurry up → нельзя опаздывать → mustn't.",["must be late — «обязан опоздать», нелогично.","can be late — разрешение, нелогично.","don't have to — «необязательно опаздывать», нелогично."]],

["On the way home, we stopped ___ some bread.",["to buy","buying","buy","bought"],"Остановились, чтобы купить → stop + to.",["stop buying = перестали покупать — противоположный смысл.","buy — после stop нужна форма to-инфинитив или -ing.","bought — после stop нельзя V2."]],
["Remember ___ the door when you leave!",["to lock","locking","lock","locked"],"Не забудь сделать (в будущем) → to.",["remember locking = помню, что запер (прошлое), а тут просьба на будущее.","lock — после remember нужен to или -ing.","locked — после remember нельзя V2."]],
["I remember ___ him at the party last year.",["meeting","to meet","meet","met"],"Помню, что сделал → -ing.",["to meet = не забыть встретиться (будущее), а тут last year.","meet — после remember нужен -ing/to.","met — после remember нельзя V2."]],
["If the soup is too bland, try ___ some salt.",["adding","to add","add","added"],"Попробуй (как эксперимент) → try + -ing.",["try to add = постарайся добавить (как будто это трудно) — не совет-эксперимент.","add — после try нужна форма -ing или to.","added — после try нельзя V2."]],
["Ryan ___ spend most of his time playing video games, but now he plays football.",["used to","is used to","was used to","use to"],"Раньше, а теперь нет → used to + V.",["is used to + -ing = привык.","was used to + -ing = был привычен.","use to — только после did/didn't."]],
["She's lived in Canada for years, so she's used to ___ cold winters.",["having","have","had","has"],"Be used to + -ing.",["to have — ошибка (to — предлог).","had — нет.","has — нет."]],
["I didn't ___ like vegetables, but now I love them.",["use to","used to","using to","uses to"],"После didn't — use to (без d).",["didn't used to — ошибка: прошедшее время уже в didn't.","using to — такой формы нет.","uses to — такой формы нет."]],
["We regret ___ you that the flight is cancelled.",["to inform","informing","inform","informed"],"С сожалением сообщаем → regret to inform.",["regret informing = жалеем, что сообщили (уже сделали).","inform — после regret нужен to или -ing.","informed — после regret нельзя V2."]],
["Type: Don't worry, you'll soon get used to ___ (wear) a uniform.","=wearing","Get used to + -ing."],
["Type: I'll never forget ___ (see) the ocean for the first time.","=seeing","Never forget + -ing (воспоминание)."]
]},

{
id:"h-caus", icon:"✂️", title:"have something done, make/let, question tags",
theory:`
<div class="rule"><b>Каузатив</b>: <code>have / get + предмет + V3</code> — кто-то делает для тебя. I <b>had my hair cut</b>. We're <b>having our house painted</b>. ✗ I cut my hair (сам постриг).</div>
<div class="rule"><b>make sb do</b> (заставить, без to) · <b>let sb do</b> (разрешить, без to) · <b>allow sb to do</b> · <b>be allowed to do</b> · пассив make: He <b>was made to</b> apologise (с to!).</div>
<table><tr><th>Question tags</th><th>Пример</th></tr>
<tr><td>+ предложение → − хвост</td><td>You're tired, <b>aren't you</b>?</td></tr>
<tr><td>− предложение → + хвост</td><td>She doesn't smoke, <b>does she</b>?</td></tr>
<tr><td>I am</td><td>I'm late, <b>aren't I</b>?</td></tr>
<tr><td>Let's</td><td>Let's go, <b>shall we</b>?</td></tr>
<tr><td>Повелительное</td><td>Open the door, <b>will you</b>?</td></tr>
<tr><td>never, nobody, nothing (отрицание!)</td><td>He never calls, <b>does he</b>?</td></tr>
<tr><td>Everyone/nobody → they</td><td>Everyone was there, <b>weren't they</b>?</td></tr></table>
<div class="rule"><b>So / Neither</b>: I like it. — <b>So do I</b>. I can't swim. — <b>Neither can I</b>. (Nor can I)</div>`,
q:[
["I ___ yesterday — do you like my new haircut?",["had my hair cut","cut my hair","had cut my hair","had my hair cutting"],"Парикмахер подстриг → had my hair cut.",["cut my hair — сам себя постриг.","had cut — Past Perfect: я подстриг (раньше).","cutting — нужна V3."]],
["My mum made me ___ my room.",["clean","to clean","cleaning","cleaned"],"Make sb do — без to.",["make sb to — ошибка (в активе).","-ing — нет.","V2 — нет."]],
["He was made ___ for his behaviour.",["to apologise","apologise","apologising","apologised"],"В пассиве make требует to: was made to do.",["Без to в пассиве — ошибка.","-ing — нет.","V2 — нет."]],
["We aren't ___ to use phones in class.",["allowed","let","made","permitted to"],"Be allowed to do.",["let не имеет пассива в таком значении.","made — «заставлены» — по смыслу нет.","permitted to to — двойное to."]],
["You're coming with us, ___?",["aren't you","are you","don't you","won't you"],"+ предложение (are) → − хвост: aren't you.",["Положительный хвост к положительному — ошибка.","do — не тот вспомогательный.","will — не тот вспомогательный."]],
["I'm right, ___?",["aren't I","amn't I","am I not't","isn't I"],"Особый случай: I am → aren't I.",["amn't — не существует в стандарте.","Неграмотная форма.","isn't с I — нет."]],
["Let's have a break, ___?",["shall we","will we","don't we","let's we"],"Let's → shall we.",["will we — так говорят после повелительного (Open the door, will you?), а после Let's — shall we.","don't we — хвост не строится от let.","let's we — такого хвоста нет."]],
["Nobody called, ___?",["did they","didn't they","did he","didn't he"],"Nobody — отрицание → положительный хвост; местоимение they.",["Отриц. хвост к отриц. — ошибка.","he — для nobody используется they.","Двойная ошибка."]],
["I can't swim. — ___.",["Neither can I","So can I","Neither can't I","So can't I"],"Согласие с отрицанием → Neither + вспом. + I.",["So can I — согласие с УТВЕРДИТЕЛЬНЫМ предложением.","Neither уже отрицание — can't даёт двойное.","So can't I — смешение двух конструкций."]],
["Type: She has never been to Paris, ___ she?","=has","Never — отрицание → положительный хвост: has she?"],
["Type: We're going to have our car ___ (repair) tomorrow.","=repaired","Каузатив: have + предмет + V3."]
]},

{
id:"h-link", icon:"🧷", title:"Связки: although, despite, however, whereas…",
theory:`
<table><tr><th>Связка</th><th>После неё</th><th>Пример</th></tr>
<tr><td><b>although / though / even though</b></td><td>подлежащее + глагол</td><td><b>Although</b> it was raining, we went out.</td></tr>
<tr><td><b>despite / in spite of</b></td><td>сущ. / -ing / the fact that</td><td><b>Despite</b> the rain… <b>In spite of</b> being tired…</td></tr>
<tr><td><b>however</b></td><td>новое предложение, запятая</td><td>It was cheap. <b>However,</b> it was bad.</td></tr>
<tr><td><b>whereas / while</b></td><td>контраст двух фактов</td><td>I like tea, <b>whereas</b> my sister prefers coffee.</td></tr>
<tr><td><b>because / since / as</b></td><td>предложение</td><td><b>As</b> it was late, we left.</td></tr>
<tr><td><b>because of / due to</b></td><td>существительное</td><td><b>Because of</b> the rain…</td></tr>
<tr><td><b>so / therefore / as a result</b></td><td>следствие</td><td>He was ill, <b>so</b> he stayed home.</td></tr>
<tr><td><b>in addition / moreover / furthermore / what is more</b></td><td>добавление</td><td></td></tr>
<tr><td><b>so that / in order to</b></td><td>цель</td><td>I left early <b>so that</b> I could catch the bus.</td></tr></table>
<div class="trap">⚠ ✗ Despite <s>it was raining</s> → ✓ Despite the rain / Despite the fact that it was raining.<br>⚠ ✗ In spite <s>the rain</s> → ✓ In spite <b>of</b> the rain.</div>`,
q:[
["___ it was raining, we went for a walk.",["Although","Despite","In spite of","However"],"Перед подлежащим + глаголом → Although.",["Despite + сущ./-ing.","In spite of + сущ./-ing.","However — отдельное предложение."]],
["___ the bad weather, the match went ahead.",["Despite","Although","However","Even though"],"Перед существительным → Despite.",["Although + предложение.","However — не связывает так.","Even though + предложение."]],
["I love maths, ___ my brother hates it.",["whereas","despite","because of","so that"],"Контраст двух фактов → whereas.",["despite + сущ.","because of + сущ.","so that — цель."]],
["The flight was delayed ___ fog.",["because of","because","although","so"],"Перед существительным → because of.",["because + предложение.","although — уступка.","so — следствие."]],
["The hotel was expensive. ___, the rooms were small and dirty.",["Moreover","However","Although","Despite"],"Добавляем ещё минус → Moreover (более того).",["However — противопоставление, а тут ещё негатив.","Although — не в начале с запятой.","Despite — с сущ."]],
["She worked hard ___ she could buy a new laptop.",["so that","in order to","because","although"],"Цель + подлежащее + could → so that.",["in order to + V без подлежащего.","because — причина.","although — уступка."]],
["In spite ___ being tired, he finished the race.",["of","—","that","for"],"In spite OF.",["Без of — ошибка.","that — нет.","for — нет."]],
["Type: The film was long. ___, it was very interesting. (противопоставление, 1 слово)","=however","However + запятая в начале предложения."]
]},

["This chair is very ___. I can't sit on it for long. (COMFORT)","=uncomfortable","Не могу сидеть долго → uncomfortable."],
["She answered the question ___. (CORRECT)","=correctly","Описывает глагол → наречие."],
["Making the right ___ is not always easy. (DECIDE)","=decision","После the right — сущ.: decision."],
["Tennis players are very ___ people. They always want to win. (COMPETE)","=competitive","Прилагательное: competitive."],
["We need more ___ about the trip. (INFORM)","=information","Сущ., неисчисляемое: information (без -s)."],
["It is ___ to swim in this river — the current is too strong. (SAFE)","=unsafe","Отрицательный смысл → unsafe."],
["The children behaved ___ during the trip. (RESPONSIBLE)","=responsibly","Наречие при behaved."],
["The ___ of the Eiffel Tower is 330 metres. (HIGH)","=height","Высота → height."],
["She's a very ___ artist. (CREATE)","=creative","Перед сущ. artist → прил."],
["Living near a busy road can be bad for your ___. (HEALTHY)","=health","После your — сущ.: health."],
["Which word is a NOUN?",["happiness","happily","happy","unhappy"],"-ness — суффикс существительного.",["-ly — наречие.","Прилагательное.","Прилагательное с отрицательной приставкой."]],
["Which word is spelt correctly?",["successful","succesful","successfull","sucessful"],"s-u-c-c-e-s-s-f-u-l: две c, две s, одна l.",["Пропущена s.","Лишняя l: суффикс -ful всегда с одной l.","Пропущена c."]],

theory:`
<div class="rule">В республиканском этапе было задание «Is this a real English word?» (wattered, outrun, couright, meticulously, hypocrisy, readly, dismay, thrive). Ловушки: лишняя/пропущенная удвоенная буква, перепутанные суффиксы, «похожие» слова.</div>
<table><tr><th>Правило</th><th>Примеры</th></tr>
<tr><td>Удвоение согласной: короткая ударная гласная + 1 согласная</td><td>stop → stopped, big → bigger, begin → beginning, travel → travelled (BrE)</td></tr>
<tr><td>НЕ удваиваем, если 2 гласные или безударный слог</td><td>rain → rained, water → <b>watered</b> (✗ wattered), visit → visited, open → opened</td></tr>
<tr><td>-y после согласной → -i</td><td>ready → <b>readily</b> (✗ readly), happy → happiness, carry → carried, study → studies</td></tr>
<tr><td>-ful всегда с одной l</td><td>beautiful, careful, successful</td></tr>
<tr><td>i перед e, кроме после c</td><td>believe, friend, receive, ceiling (искл.: weird, science)</td></tr>
<tr><td>Немая e убирается перед гласной</td><td>make → making, hope → hoping, but: see → seeing</td></tr></table>
<div class="rule">Часто путаемые написания: <b>accommodation, necessary, separate, definitely, beginning, believe, business, environment, government, embarrass, tomorrow, until, receive, successful, occasion, neighbour, foreign, Wednesday, February, address, recommend, which, whether, weather, quiet / quite, lose / loose, advice / advise, practice (n) / practise (v)</b>.</div>`,

q:[
["<div class='text'>Aigerim loved spelling competitions, but last year she was knocked out in the very first round because she misspelt the word <i>necessary</i>. She cried all the way home. The next morning, however, she made a plan: every day she learnt ten new words and asked her brother to test her. Some days she was bored, some days she wanted to quit, but she kept going. This year she reached the final and won. When a journalist asked about her secret, she smiled: “There's no secret. I just didn't give up.”</div>What did Aigerim learn?",["Regular hard work leads to success.","She learnt that competitions are unfair.","She learnt that her brother was a better speller.","She decided to stop taking part in competitions.","She realised spelling is not important."],"Ключ в конце: «I just didn't give up» + ежедневная работа → результат.",["О несправедливости ничего не сказано.","Брат лишь помогал проверять.","Наоборот — она продолжила участвовать и выиграла.","Противоречит всему тексту."]],
["<div class='text'>Timur borrowed his older brother's bike without asking and rode it to the park. On the way back he hit a stone and the front wheel bent. For an hour he thought about hiding the bike in the garage and saying nothing. In the end he went to his brother and told him everything. His brother was angry at first, but then he said, “Thanks for being honest. Let's fix it together.” They spent the whole Saturday repairing the wheel and laughing.</div>What lesson does Timur learn?",["Telling the truth is better than hiding a mistake.","You should never ride a bike to the park.","Older brothers are always angry.","It is easy to repair a bike wheel.","He should buy his own bike."],"Брат благодарит за честность — урок о правде.",["Слишком частная деталь.","Брат злился лишь сначала.","В тексте ремонт занял весь день.","Об этом ничего нет."]],
["<div class='text'>For months Dana saved her pocket money for the newest smartphone. When she finally bought it, she was excited for a few days, but soon it was just another phone. In May her family went on a picnic in the mountains where there was no signal. At first Dana was annoyed, but then her dad started telling funny stories about his childhood, her little sister taught everyone a silly dance, and they all laughed until it got dark. On the way home Dana realised it was the best day she'd had all year.</div>What did Dana realise?",["Time with people you love matters more than things.","She needed a more expensive phone.","Mountains are dangerous without a signal.","Her sister was a good dancer.","Saving money is a waste of time."],"Лучший день — с семьёй, без телефона.",["Противоречит смыслу.","Об опасности ни слова.","Деталь, не урок.","Не вывод из текста."]],
["<div class='text'>Arman understood English well, but he never spoke in class because he was afraid of making mistakes. One day his teacher invited him to the school English club. Arman said almost nothing in the first meeting. In the second, he tried to tell a short story and mixed up his tenses. To his surprise, nobody laughed; a girl helped him with a word, and the teacher praised his effort. By the end of the term Arman was the one who started conversations.</div>What did Arman understand?",["Mistakes are a normal part of learning.","He should only speak when he is sure.","English clubs are boring.","His tenses were always perfect.","He didn't need a teacher."],"Ошибки не страшны — его поддержали, и он заговорил.",["Наоборот, он начал говорить свободно.","Противоречит тексту.","Он путал времена.","Учитель помог."]],
["<div class='text'>Daniel had always loved taking photos with his phone. One summer he entered a photography contest. Most other participants had professional cameras, so he was nervous. One evening after the rain he noticed how the streetlights reflected in the puddles and took a picture. A week later he won first place. The judges said his photo showed real emotion and creativity.</div>What lesson does Daniel learn?",["Creativity matters more than equipment.","It is necessary to own a professional camera.","He studied photography from others.","He became uninterested in taking pictures.","He thought the contest was unfair."],"Победил с телефоном → главное — творчество, а не техника.",["Противоречит победе с телефоном.","Не сказано.","Наоборот.","Нет в тексте."]]

text:`<h4>Nauryz: The Festival of Spring</h4>
<p>Every year on 22 March, people across Kazakhstan celebrate Nauryz, the festival of spring and new beginnings. The holiday has been celebrated for thousands of years, long before many modern countries existed. It marks the spring equinox, the day when day and night are almost exactly the same length.</p>
<p>Preparations start days before the festival. Families clean their homes from top to bottom, pay back any money they owe and try to forget old arguments, because people believe you should enter the new year with a clean house and a clear conscience.</p>
<p>The most famous dish of the festival is <i>nauryz kozhe</i>, a soup made from seven ingredients, such as water, meat, salt, milk and different grains. The number seven is important: it symbolises the seven days of the week. Traditionally, guests were expected to visit seven homes and taste the kozhe in each one, although in big cities few people manage to do this today.</p>
<p>In towns and villages, people put up yurts in the main squares. There are concerts, horse races and traditional games such as <i>altybakan</i>, a large swing where young people meet, talk and sing songs. Older people give their blessings, called <i>bata</i>, to the young.</p>
<p>Some traditions have changed. Many families now celebrate in restaurants or watch concerts on television instead of visiting neighbours. Nevertheless, for most people Nauryz remains the warmest holiday of the year, and today it is an official public holiday lasting several days.</p>`,

text:`<h4>Learning a language my way</h4>
<p><b>A) Madina, 15 — Korean.</b> I started learning Korean because of the music I listened to, but it soon became more than a hobby. I study for about an hour every evening, and I never skip a day, even during the holidays. My biggest problem is grammar — the word order is completely different from Kazakh or Russian, so I still make silly mistakes. My parents thought it was a waste of time at first, but they changed their minds when I translated for a Korean businessman who visited my dad's company. Next summer I'm hoping to spend a month in Seoul on an exchange programme.</p>
<p><b>B) Oliver, 14 — Spanish.</b> I didn't choose Spanish — it was the only language my school offered, and to be honest I found it boring for the first two years. Everything changed when we moved to Valencia for six months because of my mum's job. I had no choice but to speak it, and I was surprised how quickly I picked it up. Now I watch Spanish football without subtitles. I've forgotten some words since we came back, which worries me, so I talk to a friend from Valencia on video calls twice a week.</p>
<p><b>C) Asel, 16 — Chinese.</b> Chinese is the hardest thing I've ever done. Learning the characters takes hours, and I still can't read a newspaper. My teacher says I have a natural talent for the tones, which most learners find terribly difficult, but I'm not so sure. I go to a language school on Saturdays; the classes are expensive, so I help pay for them by giving maths lessons to younger kids. I'd like to become a translator one day, although my friends keep telling me I should be an engineer.</p>
<p><b>D) Ben, 13 — French.</b> I learn French mostly with apps and games — I'm not a fan of textbooks. I play whenever I'm bored, sometimes for five minutes, sometimes for an hour, and I compete with my cousins to see who learns more words each month. Last year I went to Paris on a school trip and tried to order food in French, but the waiter answered in English, which was a bit disappointing! Still, I'm never embarrassed when I make mistakes — I think that's how you learn.</p>`,

text:`<h4>Why teenagers need more sleep</h4>
<p>Many parents complain that their teenage children stay up late and then can't get out of bed in the morning. <b>(1) ___</b> Scientists now believe that the problem is not laziness at all, but biology.</p>
<p>During adolescence, the body's internal clock shifts. The hormone melatonin, which makes us feel sleepy, is released about two hours later than in younger children or adults. <b>(2) ___</b> As a result, a fourteen-year-old who goes to bed at ten o'clock may simply lie awake staring at the ceiling.</p>
<p>At the same time, teenagers need more sleep than adults — around nine hours a night. <b>(3) ___</b> Lack of sleep has been linked to poor concentration, bad moods and even a higher risk of accidents.</p>
<p>Some schools have decided to do something about it. In one experiment in the USA, a group of secondary schools started lessons an hour later. <b>(4) ___</b> Attendance improved, students were late less often, and exam results went up.</p>
<p>Of course, not everyone is convinced. Critics point out that a later start means a later finish, which leaves less time for sport and part-time jobs. <b>(5) ___</b> Until then, experts advise teenagers to put their phones away an hour before bed, because the blue light from screens delays sleep even further.</p>
<div class="opts">A) So even if they go to bed early, they often find it impossible to fall asleep.<br>B) The results surprised even the researchers.<br>C) They often blame it on laziness or too much time spent on phones.<br>D) More research is needed before every school changes its timetable.<br>E) However, most of them get no more than seven.<br>F) That is why adults should also go to bed earlier.</div>`,

text:`<h4>The Sea That Came Back</h4>
<p>The Aral Sea, on the border between Kazakhstan and Uzbekistan, was once the fourth largest lake in the world. In the 1960s, the Soviet government decided to use the water of its two main rivers, the Amu Darya and the Syr Darya, to grow cotton in the desert. The plan worked for cotton, but it was a disaster for the sea. With less and less water flowing in, the Aral began to shrink. Over the following decades it split into several smaller lakes, and fishing towns such as Aralsk found themselves many kilometres from the shore. Old fishing boats were left lying in the sand, and the dry seabed became a source of salty dust storms that damaged people's health and crops.</p>
<p>For many years, the Aral Sea was seen as one of the world's worst environmental disasters. However, there is some good news. In 2005, Kazakhstan completed the Kokaral Dam, which separates the northern part of the sea — the Small Aral — from the south. The water level in the north rose faster than scientists had expected, the water became less salty, and fish returned. Today, fishermen in the region catch fish again, and some of it is even sold abroad.</p>
<p>The southern part, unfortunately, has not been so lucky, and much of it remains desert. Scientists say the whole sea will probably never return to its original size, but the story of the Small Aral shows that it is possible to repair some of the damage people have caused.</p>`,

const ATH = `<h4>Top form</h4><p>Athletes who compete at the highest level in their sport have to work hard to achieve the ideal physical condition.</p>
<p><b>A) Jessie, 31, is a 100m hurdler:</b> 'People are always commenting on my arms. I think I'm lucky genetically because I had good muscle tone even before I started training. I've actually been earning some extra money recently by posing for some photographers who appreciate the beauty of the strong, fit bodies athletes possess. Obviously, I have to watch what I eat carefully, and as desserts and chocolate are a weakness of mine, it can be a problem! I tore the ligaments in my knee three years ago and since then I've been in constant pain, and have had it operated on four times. But I'm running well at the moment. I train about three to four hours a day, six days a week. I have friends who say they wish they looked like me, but it's hard work to maintain my body in peak condition.'</p>
<p><b>B) Natasha, 16, is a gymnast:</b> 'My mother got me into gymnastics because I was an over-active child – I was always getting into trouble for standing on my head and leaping around. At the moment, I train up to six hours a day and Sunday is my only day off. I don't worry about my weight or what I eat as my parents do that for me – they think I don't know when to stop. But I do have to keep off peanuts! Anyway, it's more about muscle tone than weight. I don't envy models their bodies because they're a different shape. We're not skinny, we're toned and muscled. Most of us retire at 19 or 20 because you invariably get bigger then. Three years ago, I had a hip injury which put me out of the sport for 18 months and I had to be really committed to get through it. There are days when you're so worn out that you think "I can't do it today", but you must try to work through the exhaustion.'</p>
<p><b>C) Sophie, 21, is a backstroke swimmer:</b> 'Three years ago, I took three months out because I knew I had to if I was to carry on. I now know that every time I get in the water, it's because I really want to be there. In my time out, I occasionally treated myself to chocolate, which is normally forbidden. I didn't train either, so it was hard when I started swimming again. My body is a tool for me and I don't see it in the way other women view theirs. I was approached by a major chain store once about modelling swimwear, but I wasn't keen on the idea. I train seven days a week, which is tiring, but missing a session is never an option. I swim for two hours in the morning, then spend two hours in the gym before going back to the pool. Now that I have the advantage of financial sponsorship, I can train full-time and no longer have to get up at 4.45 am to swim before going to the office.'</p>
<p><b>D) Karen, 28, is a modern pentathlete:</b> 'I'm very competitive and I can push myself too far in training. I'm never tempted to miss it, except when I feel ill. A typical day's training is: shooting from 8 am to 9.30 am; running from 10 am to 11 am; swimming from 11 am to midday; riding from 1 pm to 3 pm; and then 45 minutes fencing. I snack on bananas to keep up my energy levels, but it's impossible to fit in time to eat and digest anything substantial until the end of the day's work-out. I limit my coffee-drinking because it's bad for me, but I can eat anything really, as long as it's in moderation. I only eat around 2,500 calories a day, which isn't much more than the average woman needs. I was studying to be a vet when I started competing in pentathlons. I was training every day and fitting it in round my coursework, which was exhausting, so eventually one of them had to go. I'm more focused now.'</p>`;

const KOREA = `<h4>COMING OF AGE KOREAN STYLE</h4>
<p>Do you know why the third Monday of May is so special in Korea? It is because you can only celebrate this day once in your life. It is Korea's coming-of-age day: something traditionally celebrated by both young men and women in the same year that they turn twenty years old. After this serious and special day, these ex-teenagers will be adult members of society. In the ceremony, they become aware of the importance of being an adult and leading the future of Korea.</p>
<p><b>So, what do you have to do if you want to take part in this festival?</b> You have to wear traditional Korean clothes, known as hanbok. These are colourful and beautiful. The young people sit in special seats in large groups – it's so impressive that it's turned into a real tourist attraction in Korea, while some foreign students actually take part in the celebration themselves. During the ceremony, the children bow to their parents out of respect. In turn, the parents also bow to their children to recognise their children's pledge to be responsible adults. Sadly, many of these customs are now seen as quite old-fashioned and are often not passed on to the next generation.</p>
<p><b>Is there a fun part?</b> For sure! You can take lots of great snaps and, of course, there are the gifts you receive on your special day. For girls, the most popular presents these days include jewellery, bags, perfume or cosmetics, while for boys, watches, electric shavers or aftershave are all well-liked. However, some girls still prefer the three traditional presents – perfume, flowers and a kiss. The perfume signifies 'Please remember me', the flowers represent happiness and beauty, and the kiss, love.</p>
<p><b>And what about the future?</b> Well, there are fears that the traditional coming-of-age day festival is being lost in Korea. Many young people now decide to organise more modern versions of the ceremony instead. To some young Koreans, twenty might seem a little old to become an adult! That's a shame because it's a totally unique festival.</p>`;

const BUGS = `<h4>Anyone for a grasshopper sandwich?</h4>
<p>Two billion people already eat bugs as part of their regular diet, according to the United Nations' Food and Agriculture Organization (FAO). Most people in Europe, however, reject the idea of entomophagy, the technical term for the human consumption of insects. <b>(11) ___</b> If citizens of Europe are going to have to start eating insects to combat world hunger, as the FAO has suggested, somebody will have to persuade them that it is a good idea.</p>
<p>The main barrier to the proposal is consumer disgust. A plate of locusts in a salad, where they look as if they are about to jump up at you, is more likely to put European diners off their food than encourage them to try it. One approach to dealing with this obstacle is to disguise the insects by grinding them into a powder to make 'protein flour'. This process is already underway at an insect farm in Malaga, Spain, which makes fishmeal for fish farms. But 'protein flour' can potentially be used in food meant for human consumption as well.</p>
<p>However, there are those who would rather see insects served in their original shape and form. Rene Redzepi, chef and co-founder of the world's most fashionable restaurant, Noma in Copenhagen, regularly includes insects on the menu. Redzepi's research unit, Nordic Food Lab, does experiments into insect 'deliciousness'. <b>(12) ___</b> Its most famous creation is the 'chimp stick' – a liquorice root brushed with honey and studded with fruits, seeds, crushed grains, leaves, flowers and … ants. It is designed to make the point that humans are primates and they enjoy pretty much the same kind of things as their chimpanzee cousins, including the taste of ants.</p>
<p>The fact that a prestigious establishment like Noma serves bugs to its diners, who pay around €200 a head, goes some way in dispelling the myth that insects are just meat for those who don't have money. <b>(13) ___</b> In countries currently in the depth of recession, comments below news articles on the internet reflect the view that 'salaries are going down, economically we're doing badly and we're going to have to eat insects.' <b>(14) ___</b></p>
<p>Despite the antipathy to insects, economics and demographics make it all but inevitable that the Western world will ultimately start eating them. Insect marketers are looking to sushi for inspiration. In the UK, people initially had problems with it because they weren't used to eating raw fish. But in thirty years, it has gone from relative obscurity to being available in every supermarket. <b>(15) ___</b> However, this will only be achieved if the top chefs can come up with recipes for using this cheap source of food in dishes that appeal to the general public.</p>
<div class="opts">a) Researchers at the lab believe that eating bugs is part of a wider move towards diversifying the food supply.<br>b) If the same can be done with insects, then the battle against world hunger may be won.<br>c) The activity is usually associated with the grim tasks set for celebrities in the jungle on reality shows.<br>d) This is the interpretation that entomophagists want to avoid, although it seems that they may be too late.<br>e) This kind of attitude does nothing to further the attractions of entomophagy.</div>`;

["20. I don't want you pay for me. I'll pay for myself.",["I don't want you to pay for me.","I don't want you paying for me.","I don't want that you pay for me.","I don't want you paid for me."],"Want + sb + TO do.",["want sb doing — неграмотно в этом значении.","want that — калька с русского.","paid — неверная форма."]],
["21. Good buy! Have nice evening!",["Goodbye! Have a nice evening!","Good buy! Have a nice evening!","Goodbye! Have nice evening!","Good bye! Have the nice evening!"],"Две ошибки: Goodbye (не buy — «покупка») + артикль a.",["buy = покупать.","Нет артикля.","the — неверный артикль."]],
["22. This house is quite old. It is build in 1935.",["It was built in 1935.","It is built in 1935.","It was build in 1935.","It built in 1935."],"Прошлое + пассив: was built.",["Неверное время.","build — V1.","Нет be — актив."]],
["23. If I know his number, I would call him.",["If I knew his number, I would call him.","If I know his number, I will call him.","If I would know his number, I would call him.","If I had know his number, I would call him."],"2-й тип: If + Past Simple (knew). Ключ олимпиады — knew.",["Это 1-й тип — грамматически верно, но исправлено ДВА места; в задании одна ошибка.","would в if — ошибка.","had know — неверная форма."]],
["24. Ann is boring because her work is not interesting.",["Ann is bored because her work is not interesting.","Ann is bore because…","Ann is boredom because…","Ann bores because…"],"Чувство человека → bored.",["bore — не прилагательное.","boredom — существительное.","bores — «надоедает» (другой смысл)."]],

["26. The house if the older in the town.",["The house is the oldest in the town.","The house is the older in the town.","The house if the oldest in the town.","The house is older in the town."],"Две ошибки: if → is; older → the oldest (in the town).",["older — для двух.","if не исправлено.","Нужна превосходная с the."]],
["27. When I went to bed, Ann was yet working.",["When I went to bed, Ann was still working.","When I went to bed, Ann was already working.","When I went to bed, Ann yet was working.","When I went to bed, Ann had yet working."],"Всё ещё → still.",["already = уже начала — смысл другой.","yet в утверждении — ошибка.","Неверная форма."]],

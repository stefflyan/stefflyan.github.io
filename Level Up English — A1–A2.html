<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up English — A1–A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7E8;--ink:#1E1940;--muted:#5f5a84;--card:#fff;
  --purple:#7B5CFF;--pink:#FF4FA0;--yellow:#FFD43B;--cyan:#1EC8E8;--green:#22C77A;--orange:#FF8A3D;--red:#FF4D5E;
  --r:20px;--sh:4px 4px 0 var(--ink);--b:2.5px solid var(--ink);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;
  background-image:radial-gradient(#ead9b8 1.2px,transparent 1.3px);background-size:22px 22px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.acc-font{font-family:'Unbounded',sans-serif;letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(28px,4.4vw,46px);margin:.2em 0 .35em;font-weight:900}
h2{font-size:clamp(21px,2.6vw,28px);margin:0 0 .5em;font-weight:700}
h3{font-size:19px;margin:0 0 .5em;font-weight:700}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* highlighter */
mark{--hl:255,212,59;color:inherit;font-weight:800;padding:.02em .32em;margin:0 -.08em;border-radius:.7em .3em .8em .35em;
  background:linear-gradient(100deg,rgba(var(--hl),0) .5%,rgba(var(--hl),.95) 2.5%,rgba(var(--hl),.75) 6%,rgba(var(--hl),.6) 92%,rgba(var(--hl),.85) 97%,rgba(var(--hl),0) 99.5%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.p{--hl:255,128,192}mark.b{--hl:100,214,255}mark.g{--hl:110,232,160}mark.o{--hl:255,170,100}mark.v{--hl:180,160,255}

/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:var(--b)}
.topin{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Unbounded';font-weight:900;font-size:19px;white-space:nowrap}
.logo .lg{width:38px;height:38px;border-radius:12px;background:var(--pink);border:var(--b);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);font-size:19px;transform:rotate(-6deg)}
.logo span em{font-style:normal;color:var(--pink)}
nav.main{display:flex;gap:6px;margin-left:8px}
nav.main a{text-decoration:none;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid transparent;white-space:nowrap}
nav.main a:hover{background:#FFF1C2}
nav.main a.on{background:var(--yellow);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.spacer{flex:1}
.mode{flex:none;display:flex;border:var(--b);border-radius:14px;overflow:hidden;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.mode button{border:0;background:transparent;padding:7px 12px;font-weight:800;cursor:pointer;font-size:14px;white-space:nowrap}
.mode button.on[data-m=easy]{background:var(--cyan)}
.mode button.on[data-m=hard]{background:var(--orange)}
.xpchip{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;border:var(--b);border-radius:14px;padding:5px 11px;background:#F1ECFF;box-shadow:2px 2px 0 var(--ink);font-weight:800;font-size:14px;white-space:nowrap}
.xpchip b{font-family:'Unbounded';font-size:13px}
main{padding:28px 0 60px}
footer{border-top:var(--b);background:#fff;padding:22px 0;text-align:center;font-weight:700}
footer .sig{font-family:'Unbounded';font-weight:700;font-size:16px}
footer small{display:block;color:var(--muted);font-weight:600;margin-top:4px}

/* ui */
.card{background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Unbounded';font-weight:700;font-size:14px;border:var(--b);border-radius:14px;padding:11px 18px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s;user-select:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.cyan{background:var(--cyan)}.btn.purple{background:var(--purple);color:#fff}
.btn.white{background:#fff}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 12px;font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.pill{display:inline-block;font-weight:800;font-size:13px;padding:3px 10px;border:2px solid var(--ink);border-radius:99px;background:#fff}
.kicker{display:inline-block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--yellow);padding:5px 12px;border-radius:99px}
.muted{color:var(--muted)}
.bar{height:16px;border:var(--b);border-radius:99px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,#ff7cbb 10px 20px);transition:width .5s}
.bar.sm{height:11px;border-width:2px}
.bar.cy>i{background:repeating-linear-gradient(45deg,var(--cyan) 0 10px,#6fe0f5 10px 20px)}
.bar.gr>i{background:repeating-linear-gradient(45deg,var(--green) 0 10px,#6fe3a8 10px 20px)}
.pagehead{margin-bottom:22px}
.pagehead p{max-width:720px;margin:.2em 0 1em;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;align-items:center;background:linear-gradient(135deg,#fff 0%,#FFF0F7 100%);position:relative;overflow:hidden}
.hero p{font-size:18px;max-width:560px}
.hero .deco{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:var(--yellow);border:var(--b);opacity:.35}
.rankcard{background:var(--ink);color:#fff;border-radius:18px;padding:22px;border:var(--b);box-shadow:4px 4px 0 var(--pink);position:relative;z-index:1}
.rankcard .ri{font-size:58px;line-height:1;display:inline-block;animation:bob 3s ease-in-out infinite}
.rankcard .lv{font-family:'Unbounded';font-size:13px;color:var(--yellow);letter-spacing:.06em}
.rankcard h3{font-size:24px;margin:.15em 0 .1em;color:#fff}
.rankcard .bar{border-color:#fff;margin:14px 0 8px}
.rankcard small{color:#cfc9ff;font-weight:700}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}
.stat{padding:18px;text-align:left}
.stat .si{font-size:26px}
.stat b{display:block;font-family:'Unbounded';font-size:26px;margin-top:4px}
.stat span{font-weight:700;color:var(--muted);font-size:14px}
.stat:nth-child(1){background:#FFF6CC}.stat:nth-child(2){background:#E2F8FF}.stat:nth-child(3){background:#F0EBFF}.stat:nth-child(4){background:#FFE7F2}
.section{margin-top:30px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step .n{width:40px;height:40px;border-radius:12px;border:var(--b);display:grid;place-items:center;font-family:'Unbounded';font-weight:900;margin-bottom:10px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.ach{display:flex;gap:12px;align-items:center;padding:14px;border:var(--b);border-radius:16px;background:#fff}
.ach .ai{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#FFF1C2;border:2px solid var(--ink);flex:none}
.ach b{display:block;font-size:15px}.ach small{color:var(--muted);font-weight:600;line-height:1.3;display:block}
.ach.locked{opacity:.45;filter:grayscale(1);background:#f6f3ee}
.mix{background:linear-gradient(135deg,#E9FBFF,#F2EDFF)}

/* grammar */
.acc-list{display:grid;gap:14px}
.acc-item{padding:0;overflow:hidden;scroll-margin-top:84px}
.acc-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;background:#fff;border:0;cursor:pointer;text-align:left}
.acc-head:hover{background:#FFFBEA}
.acc-item.open .acc-head{background:#FFF4C9;border-bottom:var(--b)}
.emo{width:48px;height:48px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;flex:none;background:#fff}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-family:'Unbounded';font-size:16px;font-weight:700}
.acc-t small{color:var(--muted);font-weight:700;font-size:14px}
.lvl{font-family:'Unbounded';font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;border:2px solid var(--ink)}
.lvl.A1{background:#BDF5D6}.lvl.A2{background:#DCD2FF}
.st{font-weight:900;font-size:13px;padding:4px 9px;border-radius:9px;background:#eee;white-space:nowrap}
.st.done{background:var(--green);color:#fff}
.chev{font-size:20px;transition:transform .25s;flex:none}
.acc-item.open .chev{transform:rotate(180deg)}
.acc-body{display:none;padding:22px}
.acc-item.open .acc-body{display:block;animation:drop .3s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.theory{font-size:17.5px}
.theory p{margin:.3em 0 .8em}
.tbl{border-collapse:separate;border-spacing:0;margin:10px 0 14px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;width:100%;max-width:680px;font-size:16px}
.tbl th{background:#D6F5FD;text-align:left;padding:8px 12px;font-weight:900;border-bottom:2px solid var(--ink)}
.tbl td{padding:7px 12px;border-bottom:1px dashed #c9c3dd}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:nth-child(even) td{background:#FFFCF1}
.rule{display:inline-block;background:#F1ECFF;border:2px dashed var(--purple);border-radius:14px;padding:10px 16px;font-weight:800;margin:4px 0 12px;font-size:17px}
.exl{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:6px}
.exl li{padding:8px 12px 8px 40px;background:#FAFAFF;border-radius:12px;position:relative;border:1.5px solid #e4e0f3}
.exl li::before{content:"💬";position:absolute;left:11px;top:8px}
.warn{background:#FFF0F0;border:2px solid var(--red);border-radius:14px;padding:10px 14px;font-weight:700;margin:8px 0 6px}
.practice{margin-top:20px;border-top:3px dotted #d8d2ea;padding-top:20px}
.prac-start{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* quiz */
.quiz{max-width:760px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.qcount{font-family:'Unbounded';font-weight:700}
.qlabel{margin-top:14px;font-weight:800;color:var(--purple);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.qtext{font-size:23px;font-weight:800;margin:12px 0 18px;line-height:1.45}
.qtext .big{font-family:'Unbounded';font-size:28px}
.qtext .ru{font-family:'Unbounded';font-size:24px}
.blank{display:inline-block;min-width:80px;text-align:center;border-bottom:3px dashed var(--pink);background:#FFF1F8;border-radius:8px 8px 0 0;padding:0 8px;color:var(--pink)}
.blank.filled{border-bottom-style:solid;color:var(--ink);background:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.opt{border:var(--b);border-radius:14px;background:#fff;padding:13px 14px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.opt:hover:not(:disabled){background:#FFF6CC;transform:translate(-1px,-1px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green);color:#fff}
.opt.wrong{background:var(--red);color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.typerow{display:flex;gap:10px;flex-wrap:wrap}
.inp{flex:1;min-width:200px;font:inherit;font-size:20px;font-weight:800;padding:12px 16px;border:var(--b);border-radius:14px;outline:none;background:#fff}
.inp:focus{box-shadow:0 0 0 4px #FFD43B88}
.inp.right{background:#D9FBE8;border-color:var(--green)}.inp.wrong{background:#FFE3E6;border-color:var(--red);animation:shake .35s}
.fb{min-height:30px;margin-top:16px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fb.ok{color:#0f8a50}.fb.no{color:#c51f37}
.result{text-align:center;padding:10px}
.result .stars{font-size:48px;letter-spacing:6px}
.result h3{font-size:24px}

/* vocab */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.theme{cursor:pointer;padding:0;overflow:hidden;transition:transform .12s;text-align:left;border:var(--b);background:#fff;border-radius:var(--r);box-shadow:var(--sh)}
.theme:hover{transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:6px 6px 0 var(--ink)}
.theme .tt{background:var(--c);padding:16px 18px;border-bottom:var(--b);display:flex;align-items:center;gap:12px}
.theme .tt .te{font-size:36px}
.theme .tt b{font-family:'Unbounded';font-size:16px;display:block}
.theme .tt small{font-weight:800;font-size:13px}
.theme .tb{padding:14px 18px}
.theme .tb small{display:block;margin-top:6px;font-weight:800;color:var(--muted)}
.theme-hero{background:var(--c);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.theme-hero .te{font-size:60px}
.theme-hero .grow{flex:1;min-width:220px}
.games{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
.gbtn{border:var(--b);border-radius:18px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:14px 10px;cursor:pointer;text-align:center;transition:transform .08s}
.gbtn:hover{transform:translate(-2px,-2px);background:#FFF6CC}
.gbtn .gi{font-size:32px;display:block}
.gbtn b{font-family:'Unbounded';font-size:13px;display:block;margin-top:4px}
.gbtn small{font-weight:700;color:var(--muted);font-size:12px;line-height:1.25;display:block;margin-top:2px}
.game-area{margin-bottom:24px;scroll-margin-top:90px}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.ghead b{font-family:'Unbounded'}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.word{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:9px 12px;position:relative}
.word .wt{flex:1;min-width:0}
.word b{display:block;font-size:17px}
.word span{color:var(--muted);font-weight:700;font-size:14px}
.word.ok{background:#E6FCEF}
.word.ok::after{content:"✓";position:absolute;right:10px;top:8px;font-weight:900;color:var(--green)}
.say{border:2px solid var(--ink);background:var(--yellow);border-radius:10px;width:34px;height:34px;cursor:pointer;flex:none;font-size:15px}
.say:active{transform:scale(.92)}
/* flashcard */
.flip{perspective:1000px;max-width:460px;margin:0 auto 18px;height:230px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--b);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Unbounded';font-size:32px;font-weight:700;box-shadow:var(--sh);padding:16px;text-align:center}
.face.f{background:linear-gradient(135deg,#FFF6CC,#FFE1EF)}
.face.b{background:linear-gradient(135deg,#DDF7FF,#EAE3FF);transform:rotateY(180deg)}
.face small{font-family:'Nunito';font-size:13px;font-weight:700;color:var(--muted);margin-top:10px}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:var(--b);border-radius:14px;background:#fff;min-height:70px;padding:8px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:all .15s;line-height:1.2}
.tile.en{background:#FFFBEA}
.tile.sel{background:var(--yellow);transform:translate(-2px,-2px) scale(1.03)}
.tile.done{background:var(--green);color:#fff;opacity:.35;cursor:default;box-shadow:none;transform:scale(.96)}
.tile.bad{background:var(--red);color:#fff;animation:shake .35s}
/* scramble */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{width:46px;height:54px;border:var(--b);border-radius:12px;display:grid;place-items:center;font-family:'Unbounded';font-size:22px;font-weight:700;background:#fff}
.slot.f{background:#FFF1C2}
.slots.ok .slot{background:var(--green);color:#fff}
.slots.no{animation:shake .35s}
.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.lt{width:50px;height:54px;border:var(--b);border-radius:12px;background:var(--cyan);font-family:'Unbounded';font-size:22px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.lt:active{transform:translate(3px,3px);box-shadow:none}
.prompt-ru{text-align:center;font-family:'Unbounded';font-size:26px;font-weight:700}
/* sprint */
.sprint{text-align:center}
.sprint .timer{font-family:'Unbounded';font-size:40px;font-weight:900}
.sprint .pair{font-size:30px;font-weight:900;margin:18px 0 6px;font-family:'Unbounded'}
.sprint .pair2{font-size:24px;font-weight:800;margin-bottom:20px}
.sprint .sc{font-weight:900;font-size:18px}
.flash-ok{animation:fok .4s}.flash-no{animation:fno .4s}
@keyframes fok{0%{background:#C9F7DD}100%{background:#fff}}
@keyframes fno{0%{background:#FFD3D8}100%{background:#fff}}

/* ranks */
.ladder{display:grid;gap:10px}
.rk{display:flex;align-items:center;gap:16px;padding:12px 16px;border:var(--b);border-radius:16px;background:#fff}
.rk .ri{font-size:34px;width:56px;text-align:center}
.rk .rt{flex:1}
.rk b{font-family:'Unbounded';font-size:16px;display:block}
.rk small{font-weight:700;color:var(--muted)}
.rk.past{background:#EAFBF1}
.rk.now{background:var(--yellow);box-shadow:var(--sh);transform:translateX(6px)}
.rk.lock{opacity:.55}
.twocol{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.xplist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.xplist li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:#FAFAFF;border:1.5px solid #e4e0f3;font-weight:700}
.xplist li b{white-space:nowrap}

/* toast/modal */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:3px 3px 0 var(--pink);animation:tin .3s ease;max-width:320px}
.toast.y{background:var(--yellow);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(30,25,64,.55);z-index:150;display:grid;place-items:center;padding:20px;animation:tin .2s}
.modal{max-width:420px;width:100%;text-align:center}
.lvup .big{font-size:90px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.lvup small{font-family:'Unbounded';font-weight:700;letter-spacing:.12em;color:var(--pink)}
.lvup h2{font-size:30px;margin:.2em 0}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

@media (max-width:1100px){.logo span{display:none}}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .games{grid-template-columns:repeat(3,1fr)}
  .twocol{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{font-size:16px;padding-bottom:76px}
  nav.main{position:fixed;bottom:0;left:0;right:0;margin:0;background:#fff;border-top:var(--b);justify-content:space-around;padding:8px 6px;z-index:60}

<script>
/* ===================== DATA: GRAMMAR ===================== */
const GRAMMAR = [
{id:"be",lvl:"A1",emoji:"🙋",title:"To be: am / is / are",ru:"Глагол «быть»",
theory:`<p>Глагол <mark>to be</mark> значит «быть, являться, находиться». В русском его часто пропускают («Я студент»), а в английском он <mark class="p">нужен всегда</mark>: I <b>am</b> a student.</p>
<table class="tbl"><tr><th>Кто</th><th>＋</th><th>－</th><th>？</th></tr>
<tr><td>I</td><td><mark>am</mark> ('m)</td><td>am not</td><td>Am I…?</td></tr>
<tr><td>he / she / it</td><td><mark>is</mark> ('s)</td><td>isn't</td><td>Is he…?</td></tr>
<tr><td>we / you / they</td><td><mark>are</mark> ('re)</td><td>aren't</td><td>Are they…?</td></tr></table>
<ul class="exl"><li>I <mark>am</mark> twelve. — Мне двенадцать.</li><li>She <mark>is</mark> at home. — Она дома.</li><li><mark class="b">Are</mark> you ready? — Yes, I <mark class="b">am</mark>.</li></ul>
<div class="warn">⚠️ В вопросе глагол <mark>выходит вперёд</mark>: You are → <b>Are you</b>…? А «I amn't» не бывает, правильно только <b>I'm not</b>.</div>`,
ex:["I ___ a student.|am|is,are","She ___ from Kazakhstan.|is|am,are","We ___ friends.|are|is,am","It ___ cold today.|is|are,am","They ___ at school now.|are|is,am","He ___ (not) hungry.|isn't/is not|aren't,am not","___ you happy?|are|is,am","I ___ (not) tired.|am not/'m not|isn't,aren't"]},

{id:"pron",lvl:"A1",emoji:"👥",title:"Pronouns: I / me / my",ru:"Местоимения",
theory:`<p>Есть три главные формы местоимений. Выбор зависит от <mark>места в предложении</mark>.</p>
<table class="tbl"><tr><th>Кто? (подлежащее)</th><th>Кого? Кому? (после глагола)</th><th>Чей? (перед сущ.)</th></tr>
<tr><td>I</td><td>me</td><td>my</td></tr><tr><td>you</td><td>you</td><td>your</td></tr><tr><td>he</td><td>him</td><td>his</td></tr><tr><td>she</td><td>her</td><td>her</td></tr><tr><td>it</td><td>it</td><td>its</td></tr><tr><td>we</td><td>us</td><td>our</td></tr><tr><td>they</td><td>them</td><td>their</td></tr></table>
<div class="rule"><mark>I</mark> love <mark class="b">them</mark>. <mark class="g">Their</mark> dog loves <mark class="b">me</mark>.</div>
<ul class="exl"><li><mark>She</mark> helps <mark class="b">him</mark>. — Она помогает ему.</li><li>This is <mark class="g">our</mark> teacher. — Это наш учитель.</li></ul>
<div class="warn">⚠️ <b>its</b> (его/её, о предмете или животном) ≠ <b>it's</b> (= it is).</div>`,
ex:["This is my sister. ___ name is Aru.|her|she,his","I love ___ (они).|them|they,their","Can you help ___ (я)?|me|I,my","Tom and ___ (я) are friends.|I|me,my","That is ___ (наш) house.|our|us,we","The dog is eating ___ food.|its|it's,it","Look at ___ (он)!|him|he,his","___ (они) live in Almaty.|they|them,their"]},

{id:"art",lvl:"A1",emoji:"🅰️",title:"Articles: a / an / the",ru:"Артикли",
theory:`<p><mark>a / an</mark> — «один, какой-то» (впервые упоминаем, единственное число). <mark class="p">the</mark> — «тот самый, конкретный» (уже известный или единственный в мире).</p>
<table class="tbl"><tr><th>Артикль</th><th>Когда</th><th>Пример</th></tr>
<tr><td><mark>a</mark></td><td>перед согласным <b>звуком</b></td><td>a cat, a university</td></tr>
<tr><td><mark>an</mark></td><td>перед гласным <b>звуком</b></td><td>an apple, an hour</td></tr>
<tr><td><mark class="p">the</mark></td><td>конкретный / уже упоминали / единственный</td><td>the sun, the door</td></tr></table>
<ul class="exl"><li>I have <mark>a</mark> dog. <mark class="p">The</mark> dog is funny.</li><li>She is <mark>an</mark> engineer. — Она инженер.</li></ul>
<div class="warn">⚠️ Решает <mark>звук</mark>, а не буква: <b>an hour</b> (h не читается), <b>a uniform</b> (звучит «ю»). Без артикля: имена, города, языки — <i>Aru, London, English</i>.</div>`,
ex:["I have ___ apple.|an|a,the","She is ___ teacher.|a|an,the","___ sun is hot.|the|a,an","It's ___ umbrella.|an|a,the","I saw a cat. ___ cat was black.|the|a,an","He is ___ honest man.|an|a,the","Close ___ door, please.|the|a,an","She studies at ___ university.|a|an,the"]},

{id:"plural",lvl:"A1",emoji:"🍎",title:"Plural nouns",ru:"Множественное число",
theory:`<p>Обычно добавляем <mark>-s</mark>: book → book<mark>s</mark>. Но есть правила:</p>
<table class="tbl"><tr><th>Окончание</th><th>Правило</th><th>Пример</th></tr>
<tr><td>s, ss, x, sh, ch, o</td><td>+ <mark>es</mark></td><td>box → boxes, potato → potatoes</td></tr>
<tr><td>согласная + y</td><td>y → <mark>ies</mark></td><td>baby → babies (но boy → boys)</td></tr>
<tr><td>f / fe</td><td>→ <mark>ves</mark></td><td>knife → knives, leaf → leaves</td></tr></table>
<p><mark class="p">Исключения</mark>, которые надо запомнить:</p>
<ul class="exl"><li>man → <mark class="p">men</mark>, woman → <mark class="p">women</mark>, child → <mark class="p">children</mark>, person → <mark class="p">people</mark></li><li>foot → <mark class="p">feet</mark>, tooth → <mark class="p">teeth</mark>, mouse → <mark class="p">mice</mark>, sheep → sheep, fish → fish</li></ul>`,
ex:["one book — two ___|books|bookes,book","one box — three ___|boxes|boxs,boxies","one baby — two ___|babies|babys,babyes","one child — five ___|children|childs,childrens","one man — two ___|men|mans,mens","one tooth — many ___|teeth|tooths,teeths","one knife — two ___|knives|knifes,knivs","one mouse — three ___|mice|mouses,mices"]},

{id:"this",lvl:"A1",emoji:"👉",title:"This / that / these / those",ru:"Указательные слова",
theory:`<p>Выбор зависит от двух вещей: <mark>близко или далеко</mark> и <mark class="b">один или много</mark>.</p>
<table class="tbl"><tr><th></th><th>Один</th><th>Много</th></tr>
<tr><td>📍 Рядом</td><td><mark>this</mark> (этот)</td><td><mark>these</mark> (эти)</td></tr>
<tr><td>🔭 Далеко</td><td><mark class="b">that</mark> (тот)</td><td><mark class="b">those</mark> (те)</td></tr></table>
<ul class="exl"><li><mark>This</mark> is my phone. — Это мой телефон (в руке).</li><li><mark class="b">Those</mark> birds are beautiful. — Те птицы (вдалеке) красивые.</li></ul>
<div class="warn">⚠️ <b>these</b> [ðiːz] и <b>this</b> [ðɪs] звучат по-разному. Не путай!</div>`,
ex:["___ book here is mine. (рядом, один)|this|these,those","___ cars over there are fast. (далеко, много)|those|that,these","___ apples here are green. (рядом, много)|these|this,those","Look at ___ bird in the sky! (далеко, один)|that|those,this","Is ___ your phone? (у меня в руке)|this|these,those","___ are my friends over there.|those|that,these","I like ___ shoes I'm wearing.|these|this,those","___ house over there is old.|that|those,this"]},

{id:"there",lvl:"A1",emoji:"📦",title:"There is / there are",ru:"Есть, имеется",
theory:`<p>Говорим, что <mark>где-то что-то есть</mark>. Русскую фразу переводим «с конца»: «В комнате есть кот» → <b>There is a cat in the room</b>.</p>
<table class="tbl"><tr><th></th><th>Ед. / неисчисл.</th><th>Мн. число</th></tr>
<tr><td>＋</td><td>There <mark>is</mark> a cat.</td><td>There <mark>are</mark> two cats.</td></tr>
<tr><td>－</td><td>There <mark class="p">isn't</mark> any milk.</td><td>There <mark class="p">aren't</mark> any cats.</td></tr>
<tr><td>？</td><td><mark class="b">Is there</mark> a bank?</td><td><mark class="b">Are there</mark> any shops?</td></tr></table>
<div class="warn">⚠️ Глагол смотрит на <mark>первое</mark> существительное: There <b>is</b> a pen and two books.</div>`,
ex:["There ___ a cat in the garden.|is|are,am","There ___ two beds in my room.|are|is,be","___ there any milk?|is|are,have","There ___ any apples. (нет)|aren't/are not|isn't,not","There ___ a lot of people here.|are|is,has","___ there any shops near here?|are|is,do","There ___ some water in the glass.|is|are,have","There ___ a bank on this street. (нет)|isn't/is not|aren't,not"]},

{id:"havegot",lvl:"A1",emoji:"🎒",title:"Have got / has got",ru:"У меня есть…",
theory:`<p><mark>have got</mark> = «у меня есть, я имею». Для he / she / it — <mark class="p">has got</mark>.</p>
<table class="tbl"><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td>＋</td><td>have got ('ve got)</td><td><mark class="p">has got</mark> ('s got)</td></tr>
<tr><td>－</td><td>haven't got</td><td>hasn't got</td></tr>
<tr><td>？</td><td><mark>Have</mark> you got…?</td><td><mark>Has</mark> she got…?</td></tr></table>
<ul class="exl"><li>I<mark>'ve got</mark> a brother. — У меня есть брат.</li><li>She <mark class="p">hasn't got</mark> a pet. — У неё нет питомца.</li><li><mark>Have</mark> you <mark>got</mark> a pen? — Yes, I have. / No, I haven't.</li></ul>`,
ex:["I ___ a brother.|have got/'ve got|has got,am got","She ___ blue eyes.|has got/'s got|have got,is got","They ___ a big house.|have got/'ve got|has got,got","He ___ (not) a car.|hasn't got/has not got|haven't got,doesn't got","___ you got a pen?|have|has,do","___ she got a pet?|has|have,does","We ___ (not) any homework.|haven't got/have not got|hasn't got,don't got","My cat ___ green eyes.|has got/'s got|have got,is got"]},

{id:"ps",lvl:"A1",emoji:"🔁",title:"Present Simple",ru:"Привычки и факты",
theory:`<p>Используем для <mark>привычек, расписаний и фактов</mark>: что происходит обычно, регулярно, всегда.</p>
<div class="rule">I / you / we / they + <mark>V</mark> &nbsp;·&nbsp; he / she / it + <mark class="p">V-s</mark></div>
<table class="tbl"><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td>＋</td><td>I play</td><td>She play<mark class="p">s</mark></td></tr>
<tr><td>－</td><td>I <mark>don't</mark> play</td><td>She <mark>doesn't</mark> play</td></tr>
<tr><td>？</td><td><mark class="b">Do</mark> you play?</td><td><mark class="b">Does</mark> she play?</td></tr></table>
<p>Правописание: watch → watch<mark>es</mark>, go → go<mark>es</mark>, study → stud<mark>ies</mark>.<br>Слова-маркеры: <mark class="g">every day, usually, often, on Mondays, at weekends</mark>.</p>
<div class="warn">⚠️ После doesn't / does глагол <mark>без -s</mark>: She doesn't <b>like</b> (не likes). Does he <b>play</b>?</div>`,
ex:["She ___ (play) tennis every Sunday.|plays|play,playing","I ___ (live) in Astana.|live|lives,living","He ___ (watch) TV in the evening.|watches|watchs,watch","My mum ___ (not/like) coffee.|doesn't like/does not like|don't like,doesn't likes","___ you speak English?|do|does,are","___ your brother work here?|does|do,is","They ___ (not/go) to school on Sunday.|don't go/do not go|doesn't go,not go","The baby ___ (cry) at night.|cries|crys,cry"]},

{id:"pc",lvl:"A1",emoji:"⏳",title:"Present Continuous",ru:"Происходит сейчас",
theory:`<p>Действие происходит <mark>прямо сейчас</mark>, в этот момент.</p>
<div class="rule">am / is / are + <mark>V-ing</mark></div>
<ul class="exl"><li>I <mark>am reading</mark> now. — Я сейчас читаю.</li><li>Look! It <mark>is raining</mark>. — Смотри! Идёт дождь.</li><li><mark class="b">Are</mark> you <mark class="b">listening</mark>? — Ты слушаешь?</li></ul>
<table class="tbl"><tr><th>Правило -ing</th><th>Пример</th></tr>
<tr><td>обычно + ing</td><td>play → playing</td></tr>
<tr><td>немая -e убирается</td><td>make → ma<mark>king</mark>, have → ha<mark>ving</mark></td></tr>
<tr><td>короткий слог: согласная удваивается</td><td>swim → swi<mark>mm</mark>ing, run → ru<mark>nn</mark>ing</td></tr>
<tr><td>-ie → y</td><td>lie → l<mark>y</mark>ing</td></tr></table>
<p>Маркеры: <mark class="g">now, right now, at the moment, Look!, Listen!</mark></p>`,
ex:["I ___ (read) a book now.|am reading/'m reading|read,is reading","Look! It ___ (rain).|is raining/'s raining|rains,raining","They ___ (play) football at the moment.|are playing/'re playing|play,is playing","She ___ (not/sleep) now.|isn't sleeping/is not sleeping|doesn't sleep,not sleeping","___ you listening to me?|are|do,is","He ___ (swim) in the pool now.|is swimming/'s swimming|is swiming,swims","We ___ (have) lunch right now.|are having/'re having|are haveing,have","What ___ you doing?|are|do,is"]},

{id:"psvspc",lvl:"A2",emoji:"⚖️",title:"Present Simple vs Continuous",ru:"Обычно или сейчас?",
theory:`<table class="tbl"><tr><th>Present Simple</th><th>Present Continuous</th></tr>
<tr><td><mark>обычно, всегда, факты</mark></td><td><mark class="p">сейчас, временно</mark></td></tr>
<tr><td>I usually <b>walk</b> to school.</td><td>Today I'<b>m taking</b> the bus.</td></tr>
<tr><td>usually, often, every day</td><td>now, today, at the moment</td></tr></table>
<p>Глаголы <mark class="b">состояния</mark> обычно не бывают в Continuous: <mark class="b">know, like, love, hate, want, need, understand, believe</mark>.</p>
<ul class="exl"><li>I <mark class="b">know</mark> the answer. (не «I am knowing»)</li><li>She <mark>works</mark> in a bank, but now she <mark class="p">is working</mark> from home.</li></ul>`,
ex:["I usually ___ (walk) to school.|walk|am walking,walks","Today I ___ (take) the bus.|am taking/'m taking|take,takes","Water ___ (boil) at 100°C.|boils|is boiling,boil","Listen! Someone ___ (sing).|is singing/'s singing|sings,sing","She ___ (work) in a bank. It's her job.|works|is working,work","Be quiet! The baby ___ (sleep).|is sleeping/'s sleeping|sleeps,sleep","He never ___ (eat) meat.|eats|is eating,eat","I ___ (know) the answer.|know|am knowing,knows"]},

{id:"can",lvl:"A1",emoji:"💪",title:"Can / can't",ru:"Умею, могу",
theory:`<p><mark>can</mark> = «могу, умею». <mark class="p">can't (cannot)</mark> = «не могу, не умею».</p>
<div class="rule">подлежащее + <mark>can</mark> + глагол (без to и без -s)</div>
<ul class="exl"><li>I <mark>can</mark> swim. — Я умею плавать.</li><li>She <mark>can</mark> speak three languages. (не «cans», не «can speaks»)</li><li>Fish <mark class="p">can't</mark> fly.</li><li><mark class="b">Can</mark> you help me? — Ты можешь мне помочь? (просьба)</li></ul>
<div class="warn">⚠️ После can глагол <mark>голый</mark>: can <b>play</b>, а не can to play / can plays.</div>`,
ex:["I ___ swim. I'm a good swimmer.|can|can't,cans","Fish ___ fly.|can't/cannot|can,don't","___ you help me, please?|can|do,are","She can ___ three languages.|speak|speaks,to speak","Penguins ___ walk, but they can't fly.|can|can't,are","___ your sister drive?|can|does,is","I'm sorry, I ___ come today.|can't/cannot|can,not","He can ___ the piano very well.|play|plays,playing"]},

{id:"waswere",lvl:"A1",emoji:"🕰️",title:"Was / were",ru:"To be в прошлом",
theory:`<p>Прошедшее время глагола to be: «был, была, были».</p>
<table class="tbl"><tr><th>Кто</th><th>＋</th><th>－</th><th>？</th></tr>
<tr><td>I / he / she / it</td><td><mark>was</mark></td><td>wasn't</td><td>Was she…?</td></tr>
<tr><td>we / you / they</td><td><mark class="p">were</mark></td><td>weren't</td><td>Were they…?</td></tr></table>
<ul class="exl"><li>I <mark>was</mark> at home yesterday. — Я был дома вчера.</li><li>They <mark class="p">were</mark> in London last year.</li><li>Where <mark class="p">were</mark> you born? — I <mark>was</mark> born in Shymkent.</li></ul>
<p>Маркеры: <mark class="g">yesterday, last week, last year, two days ago, in 2020</mark></p>`,
ex:["I ___ at home yesterday.|was|were,am","They ___ in London last year.|were|was,are","She ___ (not) at school on Monday.|wasn't/was not|weren't,didn't","___ you tired last night?|were|was,did","The film ___ very funny.|was|were,is","We ___ (not) late.|weren't/were not|wasn't,didn't","Where ___ you born?|were|was,did","It ___ cold last winter.|was|were,is"]},

{id:"past",lvl:"A2",emoji:"📜",title:"Past Simple",ru:"Прошедшее время",
theory:`<p>Законченное действие <mark>в прошлом</mark>: вчера, в прошлом году, давно.</p>
<p><b>Правильные глаголы</b> + <mark>-ed</mark>: play → play<mark>ed</mark>, like → lik<mark>ed</mark>, stop → sto<mark>pped</mark>, study → stud<mark>ied</mark>.</p>
<p><b>Неправильные</b> (учим наизусть): <mark class="p">go → went, see → saw, buy → bought, have → had, do → did, make → made, eat → ate, take → took, come → came, get → got, write → wrote, give → gave</mark></p>
<table class="tbl"><tr><th>＋</th><th>－</th><th>？</th></tr>
<tr><td>I <mark>went</mark> home.</td><td>I <mark class="b">didn't go</mark> home.</td><td><mark class="b">Did</mark> you <mark class="b">go</mark> home?</td></tr></table>
<div class="warn">⚠️ После <b>did / didn't</b> — <mark>начальная форма</mark>: Did you go? (не «Did you went?»)</div>`,
ex:["I ___ (watch) a film yesterday.|watched|watch,watchd","She ___ (go) to the park last Sunday.|went|goed,go","We ___ (see) a big dog.|saw|seed,seen","He ___ (not/call) me.|didn't call/did not call|didn't called,not called","___ you do your homework?|did|do,were","They ___ (buy) a new car.|bought|buyed,buy","I ___ (stop) the car.|stopped|stoped,stop","She ___ (study) English last year.|studied|studyed,study"]},

{id:"goingto",lvl:"A2",emoji:"🗺️",title:"Going to",ru:"Планы и намерения",
theory:`<p><mark>be going to</mark> + глагол = «собираюсь сделать». Используем для <mark>планов</mark> и для <mark class="p">предсказаний по признакам</mark> (видно, что сейчас случится).</p>
<div class="rule">am / is / are + <mark>going to</mark> + V</div>

{id:"pperf",lvl:"A2",emoji:"✅",title:"Present Perfect (intro)",ru:"Опыт и результат",
theory:`<p>Связь прошлого с <mark>настоящим</mark>: жизненный опыт (ever / never) и результат, который виден сейчас (just, already, yet).</p>
<div class="rule">have / has + <mark>V3</mark> (третья форма)</div>
<p>V3: правильные = <mark>-ed</mark> (finished). Неправильные: <mark class="p">be → been, see → seen, do → done, eat → eaten, fly → flown, write → written, go → gone</mark>.</p>
<ul class="exl"><li>I <mark>have been</mark> to Paris. — Я был в Париже (опыт).</li><li>She <mark>has just finished</mark>. — Она только что закончила.</li><li><mark class="b">Have</mark> you <mark class="b">ever seen</mark> a tiger?</li></ul>
<div class="warn">⚠️ Если есть точное время в прошлом (yesterday, in 2020), нужен <mark>Past Simple</mark>, а не Present Perfect!</div>`,

/* ===================== PREP ===================== */
GRAMMAR.forEach(g=>{g.items=g.ex.map(s=>{const [q,a,w]=s.split("|");return {q,answers:a.split("/"),wrong:w.split(",")}})});
VOCAB.forEach(t=>{t.list=t.w.split(";").map(p=>{const [en,ru]=p.split("|");return {en:en.trim(),ru:ru.trim()}})});
const TOTAL_WORDS=VOCAB.reduce((s,t)=>s+t.list.length,0);

/* ===================== STATE ===================== */
const KEY="levelup_english_v1";
function defState(){return {xp:0,words:{},grammar:{},ach:{},streak:0,lastDay:null,mode:"easy",stats:{correct:0,answered:0,games:0},flags:{}}}
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=defState();return Object.assign(d,o,{stats:Object.assign(d.stats,o.stats||{}),flags:Object.assign({},o.flags||{})})}}catch(e){}return defState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===================== HELPERS ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[’`´‘]/g,"'").replace(/[.!?]+\s*$/,"").replace(/\s+/g," ").trim()}
function hard(){return S.mode==="hard"}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function rankIdx(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r.xp)i=k});return i}
function learned(en){return (S.words[en]||0)>=2}
function learnedCount(){let n=0;VOCAB.forEach(t=>t.list.forEach(w=>{if(learned(w.en))n++}));return n}
function themeLearned(t){return t.list.filter(w=>learned(w.en)).length}
function bestOf(id){const g=S.grammar[id];return g?Math.max(g.e||0,g.h||0):0}
function doneTopics(){return GRAMMAR.filter(g=>bestOf(g.id)>=6).length}
function todayStr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

let cleanup=null;
function setCleanup(fn){if(cleanup){try{cleanup()}catch(e){}}cleanup=fn||null}

/* ===================== TOAST / MODAL / CONFETTI ===================== */
function toast(html,cls=""){const t=document.createElement("div");t.className="toast "+cls;t.innerHTML=html;$("#toasts").appendChild(t);setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),300)},2600)}
function modal(html){const ov=document.createElement("div");ov.className="ov";ov.innerHTML=`<div class="modal card">${html}</div>`;document.body.appendChild(ov);
  const close=()=>ov.remove();ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest(".close"))close()});return {el:ov,close}}
function confetti(){const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);const x=c.getContext("2d");
  const W=c.width=innerWidth,H=c.height=innerHeight;const cols=["#FF4FA0","#FFD43B","#1EC8E8","#7B5CFF","#22C77A","#FF8A3D"];
  const P=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*200,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(t-t0<3000)requestAnimationFrame(f);else c.remove()})(t0)}

/* ===================== XP / PROGRESS ===================== */
function touchDay(){const t=todayStr();if(S.lastDay===t)return;const y=new Date();y.setDate(y.getDate()-1);
  S.streak=(S.lastDay===todayStr(y))?S.streak+1:1;S.lastDay=t;S.xp+=10;toast(`🔥 Серия: ${S.streak} дн. · ежедневный бонус +10 XP`,"y")}
function addXP(n,opts={}){touchDay();const before=rankIdx(S.xp);S.xp+=n;if(!opts.quiet&&n>0)toast(`⚡ +${n} XP${opts.why?" · "+opts.why:""}`);
  checkAch();const after=rankIdx(S.xp);save();updateHeader();if(after>before)setTimeout(()=>levelUp(after),350)}
function markWord(en){const was=learned(en);S.words[en]=(S.words[en]||0)+1;if(!was&&learned(en)){toast(`🔤 Слово выучено: <b>${esc(en)}</b>`);refreshTheme()}save()}
function levelUp(i){const r=RANKS[i];confetti();modal(`<div class="lvup"><div class="big">${r.icon}</div><small>НОВЫЙ РАНГ!</small><h2>${r.name}</h2><p class="muted"><b>${r.en}</b> · Уровень ${i+1} из ${RANKS.length}</p><button class="btn pink close">Ура! 🎉</button></div>`)}

const ACH=[
{id:"first",i:"👣",t:"Первый шаг",d:"Дай первый правильный ответ",f:()=>S.stats.correct>=1},
{id:"c100",i:"💯",t:"Сотня",d:"100 правильных ответов",f:()=>S.stats.correct>=100},
{id:"c500",i:"🚀",t:"Ракета",d:"500 правильных ответов",f:()=>S.stats.correct>=500},
{id:"g1",i:"📗",t:"Грамматист",d:"Пройди тему грамматики на 6+ из 8",f:()=>doneTopics()>=1},

{id:"gall",i:"🧠",t:"Вся грамматика",d:"Пройди все 26 тем",f:()=>doneTopics()>=GRAMMAR.length},
{id:"w50",i:"🔤",t:"50 слов",d:"Выучи 50 слов",f:()=>learnedCount()>=50},
{id:"w200",i:"📖",t:"200 слов",d:"Выучи 200 слов",f:()=>learnedCount()>=200},

{id:"perfect",i:"⭐",t:"Идеально",d:"Пройди тест без единой ошибки",f:()=>!!S.flags.perfect},
{id:"hard",i:"🔥",t:"Хардкор",d:"Пройди тест на сложном уровне (6+)",f:()=>!!S.flags.hard},
{id:"match",i:"🧩",t:"Мастер пар",d:"Заверши игру «Пары»",f:()=>!!S.flags.match},
{id:"sprint",i:"⚡",t:"Молния",d:"Набери 20+ очков в «Спринте»",f:()=>!!S.flags.sprint},
{id:"s3",i:"📅",t:"3 дня подряд",d:"Занимайся 3 дня подряд",f:()=>S.streak>=3},
{id:"s7",i:"🗓️",t:"Неделя силы",d:"Занимайся 7 дней подряд",f:()=>S.streak>=7}
];
function checkAch(){ACH.forEach(a=>{if(!S.ach[a.id]&&a.f()){S.ach[a.id]=todayStr();S.xp+=20;setTimeout(()=>toast(`🏅 Достижение: <b>${a.t}</b> · +20 XP`,"y"),500)}})}

/* ===================== HEADER / MODE ===================== */
function updateHeader(){const i=rankIdx(S.xp),r=RANKS[i];$("#xpchip").innerHTML=`<span>${r.icon}</span><b>Lv ${i+1}</b><span class="xpn">${S.xp} XP</span>`;
  $$(".mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.mode))}
$$(".mode button").forEach(b=>b.addEventListener("click",()=>{if(S.mode===b.dataset.m)return;S.mode=b.dataset.m;save();updateHeader();
  toast(S.mode==="hard"?"🔥 Сложный уровень: вводи ответы сам, XP ×2":"🌤 Лёгкий уровень: выбирай из вариантов");render()}));

/* ===================== QUIZ ENGINE ===================== */
function fmtQ(q){return esc(q).replace("___",'<span class="blank">?</span>')}
function runQuiz(el,qs,cfg){
  setCleanup(null);
  let i=0,score=0;const isHard=hard();
  function show(){
    if(i>=qs.length)return finish();
    const q=qs[i];let answered=false;
    el.innerHTML=`<div class="quiz">
      <div class="qhead"><span class="pill">${esc(cfg.title||"Практика")} · ${isHard?"🔥 Сложный":"🌤 Лёгкий"}</span><span class="qcount">${i+1} / ${qs.length}</span></div>
      <div class="bar sm cy"><i style="width:${i/qs.length*100}%"></i></div>
      ${q.label?`<div class="qlabel">${q.label}</div>`:""}
      <div class="qtext">${q.html||fmtQ(q.q)}</div>
      ${q.type?`<div class="typerow"><input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напиши ответ…"><button class="btn purple chk">Проверить</button></div>`
        :`<div class="opts">${shuffle(q.opts).map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`}
      <div class="fb"></div></div>`;
    const fb=$(".fb",el);
    function done(ok,btn){
      answered=true;S.stats.answered++;
      const blank=$(".blank",el);if(blank){blank.textContent=q.answers[0];blank.classList.add("filled")}
      if(ok){score++;S.stats.correct++;addXP(cfg.xp||(isHard?10:5),{quiet:true});q.onRight&&q.onRight();
        fb.className="fb ok";fb.innerHTML=`🎉 ${["Верно!","Отлично!","Супер!","Так держать!","Great job!"][Math.floor(Math.random()*5)]} <span class="pill">+${cfg.xp||(isHard?10:5)} XP</span>`}
      else{fb.className="fb no";fb.innerHTML=`😅 Правильно: <mark>${esc(q.answers[0])}</mark>`;save()}
      const nb=document.createElement("button");nb.className="btn pink";nb.textContent=i+1<qs.length?"Дальше →":"Результат 🏁";
      nb.onclick=()=>{i++;show()};fb.appendChild(nb);setTimeout(()=>nb.focus(),30);
    }
    if(q.type){const inp=$(".inp",el);setTimeout(()=>inp.focus(),30);
      const check=()=>{if(answered)return;const v=inp.value;if(!v.trim()){inp.focus();return}const ok=q.answers.some(a=>norm(a)===norm(v));inp.classList.add(ok?"right":"wrong");inp.disabled=true;$(".chk",el).disabled=true;done(ok)};
      $(".chk",el).onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()})}
    else{$$(".opt",el).forEach(b=>b.onclick=()=>{if(answered)return;const ok=q.answers.some(a=>norm(a)===norm(b.textContent));
      $$(".opt",el).forEach(x=>{x.disabled=true;if(q.answers.some(a=>norm(a)===norm(x.textContent)))x.classList.add("right")});if(!ok)b.classList.add("wrong");done(ok)})}
  }
  function finish(){
    const r=score/qs.length;const stars=r>=.9?3:r>=.6?2:r>0?1:0;let bonus=0;
    if(r>=.5){bonus=(cfg.bonus??15)*(isHard?2:1);if(score===qs.length)bonus+=15}
    if(score===qs.length)S.flags.perfect=true;
    if(isHard&&score>=6)S.flags.hard=true;
    cfg.onFinish&&cfg.onFinish(score,qs.length);
    if(bonus)addXP(bonus,{why:score===qs.length?"идеальный результат!":"бонус за тест"});else{checkAch();save();updateHeader()}
    const msg=r===1?"Безупречно! Ты гений 🧠":r>=.75?"Очень круто! Почти идеально 💪":r>=.5?"Хорошо! Ещё немного практики 🙂":"Не сдавайся, повтори правило и попробуй снова 🌱";
    el.innerHTML=`<div class="result"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div><h3>${score} из ${qs.length}</h3><p>${msg}</p>${bonus?`<p><mark>+${bonus} XP бонус</mark></p>`:""}
      <div class="row center"><button class="btn pink again">🔁 Ещё раз</button>${cfg.close?'<button class="btn white cl">Закрыть</button>':""}</div></div>`;
    $(".again",el).onclick=()=>cfg.restart();if(cfg.close)$(".cl",el).onclick=cfg.close;
    if(r===1)confetti();
  }
  show();
}

/* Scramble */
function gScramble(el,t){
  setCleanup(null);const isH=hard();const pool=shuffle(t.list.filter(w=>/^[a-z]{3,10}$/i.test(w.en))).slice(0,8);let i=0,score=0;
  function show(){
    if(i>=pool.length)return gameDone(el,"Слова собраны!",`Правильно: ${score} из ${pool.length}`,score>=pool.length/2?(isH?30:15):0,()=>gScramble(el,t));
    const w=pool[i];const target=w.en.toLowerCase();
    let letters=target.split("").map((c,k)=>({c,k}));let tries=0;do{letters=shuffle(letters);tries++}while(letters.map(x=>x.c).join("")===target&&tries<10);
    let built=[],fixed=0;
    if(!isH){const f=letters.findIndex(x=>x.c===target[0]);built.push(letters[f]);letters.splice(f,1);fixed=1}
    let busy=false;
    function draw(){
      el.innerHTML=`<div class="ghead"><b>🔠 Собери слово</b><span class="pill">${i+1} / ${pool.length} · ✓ ${score}</span></div>
        <div class="prompt-ru">${esc(w.ru)}</div>
        <div class="slots">${target.split("").map((_,k)=>`<div class="slot ${k<fixed?"f":""}">${built[k]?built[k].c:""}</div>`).join("")}</div>
        <div class="letters">${letters.map((x,k)=>`<button class="lt" data-k="${k}">${x.c}</button>`).join("")}</div>
        <div class="row center"><button class="btn white bk">⌫ Стереть</button><button class="btn orange sk">Пропустить →</button></div>`;
      $$(".lt",el).forEach(b=>b.onclick=()=>{if(busy)return;built.push(letters.splice(+b.dataset.k,1)[0]);draw();
        if(built.length===target.length){const ok=built.map(x=>x.c).join("")===target;const sl=$(".slots",el);busy=true;
          if(ok){sl.classList.add("ok");speak(w.en);score++;markWord(w.en);S.stats.correct++;addXP(isH?10:5,{quiet:true});setTimeout(()=>{i++;show()},900)}
          else{sl.classList.add("no");setTimeout(()=>{letters=letters.concat(built.splice(fixed));busy=false;draw()},600)}}});
      $(".bk",el).onclick=()=>{if(busy||built.length<=fixed)return;letters.push(built.pop());draw()};
      $(".sk",el).onclick=()=>{if(busy)return;busy=true;$$(".slot",el).forEach((s,k)=>s.textContent=target[k]);toast(`Ответ: <b>${esc(w.en)}</b>`);speak(w.en);setTimeout(()=>{i++;show()},1200)};
    }
    draw();
  }
  show();
}

function gSprint(el,t){

  function next(){const w=t.list[Math.floor(Math.random()*t.list.length)];const truth=Math.random()<.5;let shown=w.ru;
    if(!truth){const o=shuffle(t.list.filter(x=>x.ru!==w.ru))[0];shown=o.ru}cur={w,truth};
    $(".pair",el).textContent=w.en;$(".pair2",el).textContent=shown}
  el.innerHTML=`<div class="sprint"><div class="ghead"><b>⚡ Спринт</b><span class="pill">← неверно · верно →</span></div>
    <div class="timer">⏱ <span id="tm">${time}</span></div><div class="sc">Очки: <span id="sc">0</span> · ошибок: <span id="ms">0</span></div>
    <div class="pair"></div><div class="pair2"></div>
    <div class="row center"><button class="btn red no">✗ Неверно</button><button class="btn green yes">✓ Верно</button></div></div>`;
  function ans(yes){if(over)return;const ok=yes===cur.truth;const box=$(".sprint",el);box.classList.remove("flash-ok","flash-no");void box.offsetWidth;box.classList.add(ok?"flash-ok":"flash-no");
    if(ok){score++;S.stats.correct++;if(cur.truth)markWord(cur.w.en);addXP(isH?3:2,{quiet:true})}else miss++;
    $("#sc").textContent=score;$("#ms").textContent=miss;next()}
  $(".yes",el).onclick=()=>ans(true);$(".no",el).onclick=()=>ans(false);
  const key=e=>{if(e.key==="ArrowRight")ans(true);if(e.key==="ArrowLeft")ans(false)};
  document.addEventListener("keydown",key);
  const iv=setInterval(()=>{time--;const tm=$("#tm");if(tm)tm.textContent=time;if(time<=0){over=true;stop();if(score>=20)S.flags.sprint=true;
    gameDone(el,"Время вышло!",`Очки: ${score} · ошибок: ${miss}`,score>=5?Math.min(40,score*(isH?2:1)):0,()=>gSprint(el,t))}},1000);
  function stop(){clearInterval(iv);document.removeEventListener("keydown",key)}
  setCleanup(stop);next();
}

/* ===================== RANKS ===================== */
function renderRanks(){
  const i=rankIdx(S.xp);const el=$("#v-ranks");
  el.innerHTML=`<section class="pagehead"><span class="kicker">🏆 Система рангов</span><h1>Твой путь: <mark class="p">${RANKS[i].icon} ${RANKS[i].name}</mark></h1>
    <p>Набирай XP, чтобы подниматься по лестнице. Сейчас у тебя <mark>${S.xp} XP</mark>.</p></section>
  <div class="twocol">
    <div class="ladder">${RANKS.map((r,k)=>`<div class="rk ${k<i?"past":k===i?"now":"lock"}"><div class="ri">${k>i?"🔒":r.icon}</div><div class="rt"><b>${k+1}. ${r.name}</b><small>${r.en}</small></div><span class="pill">${r.xp} XP</span></div>`).join("")}</div>
    <div style="display:grid;gap:18px">
      <div class="card"><h3>⚡ Как получать XP</h3><ul class="xplist">
        <li>Правильный ответ (лёгкий)<b>+5 XP</b></li><li>Правильный ответ (сложный)<b>+10 XP</b></li>
        <li>Тест пройден на 50%+<b>+15 / +30 XP</b></li><li>Тест без ошибок<b>+15 XP</b></li>
        <li>Игры со словами<b>+2…10 за ответ</b></li><li>Завершённая игра<b>до +40 XP</b></li>
        <li>Первое занятие за день<b>+10 XP</b></li><li>Новое достижение<b>+20 XP</b></li></ul></div>
      <div class="card"><h3>📊 Статистика</h3><ul class="xplist">
        <li>Ответов всего<b>${S.stats.answered}</b></li><li>Правильных<b>${S.stats.correct}</b></li><li>Сыграно игр<b>${S.stats.games}</b></li>
        <li>Слов выучено<b>${learnedCount()} / ${TOTAL_WORDS}</b></li><li>Тем пройдено<b>${doneTopics()} / ${GRAMMAR.length}</b></li><li>Серия дней<b>🔥 ${S.streak}</b></li></ul></div>
      <div class="card" style="background:#FFF0F0"><h3>♻️ Сбросить прогресс</h3><p class="muted" style="margin-top:0">Прогресс хранится только в этом браузере. Сброс удалит XP, слова и достижения.</p><button class="btn red" id="reset">Сбросить всё</button></div>
    </div>
  </div>
  <section class="section"><h2>🏅 Достижения <span class="pill">${Object.keys(S.ach).length} / ${ACH.length}</span></h2><div class="achgrid">${achHTML()}</div></section>`;
  $("#reset").onclick=()=>{const m=modal(`<div style="font-size:54px">🗑️</div><h2>Точно сбросить?</h2><p>Весь прогресс будет удалён без возможности восстановления.</p><div class="row center"><button class="btn white close">Отмена</button><button class="btn red yes">Да, сбросить</button></div>`);
    $(".yes",m.el).onclick=()=>{const mode=S.mode;S=defState();S.mode=mode;save();m.close();updateHeader();render();toast("Прогресс сброшен. Начинаем заново! 🌱")}};
}

/* ===================== ROUTER ===================== */
const VIEWS={home:renderHome,grammar:renderGrammar,vocab:renderVocab,ranks:renderRanks};
let cur="home";
function render(){setCleanup(null);VIEWS[cur]()}
function route(){let v=(location.hash||"#home").slice(1);if(!VIEWS[v])v="home";const changed=v!==cur;cur=v;
  $$(".view").forEach(e=>e.hidden=e.id!=="v-"+v);$$("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===v));render();if(changed)window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
updateHeader();route();
</script>
</body>
</html>
